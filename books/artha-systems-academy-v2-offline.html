<script>
/* ARTHA v2 supplemental authored engineering masterclasses. */
(function(){
const D=window.ARTHA_DATA;if(!D)return;
const E={"topics":{"os-working-set-model-and-thrashing":{"explain":["A working set is the set of pages used by a process within a trailing reference window. If the active working sets across tasks exceed available frames, repeated eviction and reloading can dominate useful work. This is thrashing: rising fault activity, I/O and scheduling overhead with collapsing throughput.","Window choice changes the working-set estimate. A small window misses longer locality cycles; an excessively large window retains old working phases. Page-fault frequency control aims to allocate more frames to tasks faulting excessively, or reduce multiprogramming when memory is fundamentally insufficient.","Linux exposes reclaim pressure through vmstat, major faults and /proc/pressure/memory; the mechanism is more sophisticated than exact FIFO/LRU. Correlate PSI with user-visible latency and page cache behavior before changing swapping policy."],"sample":"vmstat 1 3\ncat /proc/pressure/memory\ngrep -E \"pgmajfault|pgscan|pgsteal\" /proc/vmstat | head\nfree -h","language":"bash","trace":["Draw a reference string and count unique pages in a fixed sliding window.","Distinguish working-set growth from process memory leak.","Explain why higher CPU utilization is not guaranteed during thrashing.","Verify observable result","Document constraints / rollback"],"checks":["Draw a reference string and count unique pages in a fixed sliding window.","Distinguish working-set growth from process memory leak.","Explain why higher CPU utilization is not guaranteed during thrashing."],"quiz":[["How do you distinguish thrashing from high CPU compute load?","Thrashing involves reclaim/page faults/stalls and often increased I/O with reduced useful throughput."]]},"os-tlb-reach-asids-and-huge-pages":{"explain":["A TLB caches virtual-to-physical page translations. Its reach is approximately entries times page size. A 128-entry TLB for 4 KiB pages covers roughly 512 KiB if fully utilized; 2 MiB pages multiply potential coverage substantially.","Address-space identifiers (or PCIDs on some systems) help distinguish translations from separate address spaces and can reduce broad flushes across task switches. A permission or mapping change still requires coherent invalidation across cores.","Huge pages trade translation overhead against internal fragmentation, compaction, page migration constraints and allocation failures. Benchmark a representative workload; do not globally enable huge pages based only on a theoretical reach calculation."],"sample":"python3 - <<'PY'\nfor p in (4096, 2*1024*1024):\n    print(p, \"bytes per page; 128 entries reach\",128*p//1024,\"KiB\")\nPY\ngetconf PAGESIZE","language":"bash","trace":["Compute reach for several TLB sizes.","Show why a TLB miss is not equivalent to a major page fault.","Identify huge page fragmentation tradeoffs.","Verify observable result","Document constraints / rollback"],"checks":["Compute reach for several TLB sizes.","Show why a TLB miss is not equivalent to a major page fault.","Identify huge page fragmentation tradeoffs."],"quiz":[["What is TLB reach?","Approximate virtual memory covered by cached translations: entries × page size."]]},"linux-page-cache-buffered-i-o-and-direct-i-o":{"explain":["Buffered reads generally consult page cache; cache hits avoid physical reads, while misses request blocks and populate cached pages. Readahead can fetch sequential file blocks in anticipation of future access. Buffered writes dirty pages and schedule background writeback.","Calling write() does not always imply data is durable on physical media. Applications needing crash consistency use appropriate fsync/fdatasync and understand filesystem/device ordering. O_DIRECT bypasses parts of the page cache but can have alignment and implementation requirements; it is not a universal performance improvement.","Inspect Cached, Dirty, Writeback, vmstat and iostat together. Do not drop host page caches in a production performance test: it disrupts unrelated workloads and measures an artificial cold state."],"sample":"grep -E \"Cached|Dirty|Writeback\" /proc/meminfo\nvmstat 1 3\niostat -xz 1 3 # if sysstat is installed","language":"bash","trace":["Explain difference between write() and fsync().","Draw read miss versus read cache hit paths.","Identify what O_DIRECT changes and what it does not promise.","Verify observable result","Document constraints / rollback"],"checks":["Explain difference between write() and fsync().","Draw read miss versus read cache hit paths.","Identify what O_DIRECT changes and what it does not promise."],"quiz":[["Does a successful write() prove crash persistence?","No. Application and filesystem durability rules may require fsync or another explicit barrier."]]},"linux-conntrack-nat-and-firewall-traversal":{"explain":["The Linux packet path traverses hooks in netfilter. Connection tracking records flow tuple and protocol state to support stateful firewalling and network address translation. NAT changes address/port tuples for a tracked connection; later packets reuse that translation.","A broken route, wrong zone, policy rule and conntrack table saturation produce different symptoms. A security group outside the host can also block traffic before the packet arrives. Debug with counters, ip route, nft rules and ss before using disruptive firewall reloads.","Packet capture can reveal handshake phases, but may contain confidential data. Observe only traffic you own or have authorization to investigate."],"sample":"ip route show\nip rule show\nss -s\nsudo nft list ruleset | head -60\n# Check conntrack tools and limits only if available","language":"bash","trace":["Draw ingress and egress lookup stages.","Differentiate conntrack from a socket table.","Recognize SYN timeout due to firewall versus TLS certificate error.","Verify observable result","Document constraints / rollback"],"checks":["Draw ingress and egress lookup stages.","Differentiate conntrack from a socket table.","Recognize SYN timeout due to firewall versus TLS certificate error."],"quiz":[["Why can TCP NAT work without changing application payload?","Kernel conntrack tracks and reverses address/port translations on corresponding packets."]]},"kernel-memory-cgroups-and-oom-behavior":{"explain":["Cgroup v2 memory.current reports current memory charged to a cgroup, memory.high triggers throttling/reclaim pressure, and memory.max is an enforced limit. memory.events records conditions including high, max and OOM-related events. Container memory accounting is therefore not identical to overall host free memory.","At an allocation boundary, memcg reclaim can be unable to free sufficient pages even when the host has free memory elsewhere. This can trigger a cgroup-local OOM kill. The oom_score_adj, allocation context and policy affect victim selection; inspecting dmesg and cgroup memory.events is more useful than guessing.","For investigations, record the cgroup path and its ancestor limits, recent workload changes, page cache versus anonymous usage, PSI stalls and observed killed processes. Memory.max changes require cautious capacity planning."],"sample":"cat /sys/fs/cgroup/memory.current 2>/dev/null\ncat /sys/fs/cgroup/memory.max 2>/dev/null\ncat /sys/fs/cgroup/memory.events 2>/dev/null\ncat /proc/pressure/memory","language":"bash","trace":["Explain difference between memory.high and memory.max.","Map one OOM log to a memory cgroup.","Distinguish host OOM from memcg OOM.","Verify observable result","Document constraints / rollback"],"checks":["Explain difference between memory.high and memory.max.","Map one OOM log to a memory cgroup.","Distinguish host OOM from memcg OOM."],"quiz":[["Can a process OOM despite the host showing available memory?","Yes; an enforced cgroup limit may cause a local OOM."]]},"kernel-locking-rcu-and-memory-barriers":{"explain":["Mutexes permit sleeping while waiting and protect state in sleepable contexts. Spinlocks busy-wait and are used in short non-sleepable critical sections; they may also interact with interrupt disabling depending on context. Holding locks longer raises contention and potentially deadlock risk.","RCU is aimed at scalable read-mostly data structures: readers access published state under read-side critical sections while writers publish replacements and wait for an appropriate grace period before freeing old memory. RCU does not automatically make arbitrary mutable fields safe.","Memory barriers and acquire-release operations constrain ordering of memory accesses across CPUs; they do not on their own provide mutual exclusion. Match source code and documentation to a kernel version to understand barriers and lifetimes."],"sample":"uname -r\n# Source-oriented lab: inspect matching kernel tree\n# grep -R \"rcu_read_lock\" linux/kernel | head\ncat /proc/lock_stat 2>/dev/null | head","language":"bash","trace":["Explain mutex versus spinlock contexts.","Draw RCU publish/grace-period/reclaim sequence.","Distinguish atomicity, mutual exclusion and visibility ordering.","Verify observable result","Document constraints / rollback"],"checks":["Explain mutex versus spinlock contexts.","Draw RCU publish/grace-period/reclaim sequence.","Distinguish atomicity, mutual exclusion and visibility ordering."],"quiz":[["Why does RCU defer freeing replaced data?","Active readers may still hold references to the previous version until a grace period passes."]]},"rhcsa-systemd-units-and-targets":{"explain":["Systemd starts services through units. A service unit describes ExecStart, working directory, environment, restart behavior and dependencies. Unit activation order is a graph: After/Before controls ordering, while Wants/Requires influence pulling units in; they are different questions.","Use systemctl cat to inspect the effective unit including drop-ins. Changes to unit files normally require daemon-reload, whereas enabling controls symlink-based start-on-boot behavior. Starting a service now does not necessarily enable it after reboot.","A production-quality debug path checks loaded unit, dependencies, executable user, file permissions, journal, exit status, environment, SELinux denials and network readiness. Avoid editing vendor unit files in place when a drop-in is suitable."],"sample":"systemctl cat sshd 2>/dev/null || systemctl cat ssh\nsystemctl status sshd --no-pager 2>/dev/null\nsystemctl list-dependencies multi-user.target | head\nsystemd-analyze critical-chain","language":"bash","trace":["Explain After versus Requires.","Find loaded drop-ins and runtime service state.","Demonstrate enable and active are separate states.","Verify observable result","Document constraints / rollback"],"checks":["Explain After versus Requires.","Find loaded drop-ins and runtime service state.","Demonstrate enable and active are separate states."],"quiz":[["Does After=foo.service start foo.service?","No, ordering alone does not pull in the dependency; Wants or Requires may be needed."]]},"rhcsa-selinux-diagnosis-with-avc-evidence":{"explain":["When a service reports permission denied, test DAC and SELinux independently. A successful chmod does not override SELinux. AVC events record attempted source domain, target type, target class and denied permissions; correlate those with application logs.","For file labeling, fcontext rules describe expected persistent contexts and restorecon applies them. For policy flags, a documented boolean might allow the desired action. Port type labels may be needed when services bind nonstandard ports. Every change must be restricted to the required access.","Avoid setenforce 0 as the permanent fix, audit2allow blindly generating broad exceptions, or chmod 777. Verify persistence with semanage fcontext -l and semanage port -l where appropriate, and audit for new AVC denials."],"sample":"getenforce\nls -Zd /srv /var/www/html\nsudo ausearch -m AVC -ts recent | tail -30\nsudo semanage fcontext -l | grep httpd | head","language":"bash","trace":["Record DAC and SELinux labels before a repair.","Explain source/target type in an AVC.","Propose a narrowly scoped persistent remediation.","Verify observable result","Document constraints / rollback"],"checks":["Record DAC and SELinux labels before a repair.","Explain source/target type in an AVC.","Propose a narrowly scoped persistent remediation."],"quiz":[["Why is audit2allow output not automatically safe?","It may grant unnecessary permissions; identify root cause and use known policy/labels first."]]},"rhce-ansible-check-mode-and-idempotence-audit":{"explain":["A convergent Ansible task reports changed when it actually alters state. On a stable desired-state configuration, repeated executions should usually converge to changed=0. Idempotence is central to safe automation but depends on module semantics and accurate state modeling.","--check simulates changes for modules supporting check mode; it cannot perfectly predict the effects of shell/command tasks or changes that rely on earlier skipped prerequisites. --diff can expose changes to templates/files; ensure it cannot leak secrets.","A disciplined test runs ansible-lint, syntax-check, inventory inspection, check/diff if valid, full deployment in a disposable environment, another full deployment, service acceptance tests and a rollback drill."],"sample":"ansible-inventory --graph\nansible-playbook --syntax-check site.yml\nansible-playbook --check --diff site.yml\n# Lab only, after reviewing tasks:\n# ansible-playbook site.yml","language":"bash","trace":["Show changed counts across first and second run.","Give one example that does not support check mode well.","Explain how no_log and diff output affect secrets.","Verify observable result","Document constraints / rollback"],"checks":["Show changed counts across first and second run.","Give one example that does not support check mode well.","Explain how no_log and diff output affect secrets."],"quiz":[["Does --check prove a play will succeed?","No; some modules skip or simulate imperfectly and dependencies can behave differently."]]},"rhce-serial-rolling-deployment-and-handler-timing":{"explain":["A rolling deployment uses serial to limit the set of hosts updated per batch. For each batch, tasks and handlers change desired state, and validation probes determine whether to continue. This reduces fleet-wide blast radius but does not remove the need for application capacity.","Handlers can be triggered by changed tasks and generally execute at play flush points. max_fail_percentage and any_errors_fatal alter failure thresholds, while delegate_to is useful for controller-side load-balancer actions but needs idempotent, authorized semantics.","A robust pattern drains one node, updates it, performs a health check, puts it back in service and continues. For one replica workloads, the same plan could cause downtime: validate redundancy and traffic capacity first."],"sample":"---\n- hosts: web\n  serial: 1\n  become: true\n  tasks:\n    - name: Ensure web package\n      ansible.builtin.package:\n        name: httpd\n        state: present\n    - name: Health check after convergence\n      ansible.builtin.uri:\n        url: http://127.0.0.1/\n        status_code: 200\n      register: check","language":"yaml","trace":["Explain serial=1 execution batches.","Design drain/update/health/rejoin gates.","Name what happens if health check fails on first host.","Verify observable result","Document constraints / rollback"],"checks":["Explain serial=1 execution batches.","Design drain/update/health/rejoin gates.","Name what happens if health check fails on first host."],"quiz":[["What does serial do?","Limits hosts processed together in batches, useful for controlled rolling changes."]]},"python-secure-subprocess-and-command-execution":{"explain":["subprocess.run accepts an argument list, avoiding shell parsing in most cases and reducing injection risks. Passing untrusted input into a formatted string with shell=True can make shell metacharacters execute commands. Prefer explicit binaries, a validated allowlist and sensible working directory.","Timeouts prevent indefinite hangs; check=True raises CalledProcessError for nonzero status; capture_output collects stdout/stderr but can use memory for large output. Handle stderr and ensure secrets do not appear in logs or process arguments.","When automation modifies a live system, add dry-run, logging with redaction, idempotence and a privilege boundary. Input validation alone cannot replace least privilege."],"sample":"import subprocess\n\ndef disk_usage():\n    result = subprocess.run([\"df\", \"-h\", \"/\"], capture_output=True, text=True,\n                            timeout=5, check=True)\n    return result.stdout\n\nprint(disk_usage())","language":"python","trace":["Show why an argument array avoids shell interpretation.","Handle timeout and CalledProcessError.","Explain large output and sensitive logging concerns.","Verify observable result","Document constraints / rollback"],"checks":["Show why an argument array avoids shell interpretation.","Handle timeout and CalledProcessError.","Explain large output and sensitive logging concerns."],"quiz":[["Why avoid shell=True with untrusted input?","Shell metacharacters can be interpreted as commands and lead to injection."]]},"python-python-linux-automation-capstone":{"explain":["Build a predictable Linux observability script: read /proc/pressure/memory, check disk capacity, parse journal events and write structured JSON records. Separate collectors from storage, set explicit timeouts and parse failures, and preserve event timestamps in UTC.","A crash-safe checkpoint must not advance before data is durably stored. SQLite transactions can atomically commit deduplicated events keyed by event ID or (source, timestamp, hash) as appropriate; remember WAL journaling and concurrency rules. Config should be outside source code and secrets omitted from logs.","Test with simulated malformed lines, I/O failures, duplicate events and restarts. Prove no lost/unbounded duplicate events within your defined delivery assumptions. Rate-limit alerts and emit operational metrics about pipeline lag."],"sample":"import json, pathlib, datetime\np = pathlib.Path(\"/proc/pressure/memory\")\nif p.exists():\n    print(json.dumps({\n        \"ts\": datetime.datetime.now(datetime.timezone.utc).isoformat(),\n        \"memory_pressure\": p.read_text().splitlines()[:2]\n    }))","language":"python","trace":["Write parser and storage tests for duplicates.","Demonstrate restart at old checkpoint safely.","Explain delivery guarantee and recovery strategy.","Verify observable result","Document constraints / rollback"],"checks":["Write parser and storage tests for duplicates.","Demonstrate restart at old checkpoint safely.","Explain delivery guarantee and recovery strategy."],"quiz":[["When should a log collector save its checkpoint?","Only after durable storage/acknowledgment of the corresponding events, per its delivery contract."]]},"elk-logstash-persistent-queues-and-dlq":{"explain":["Logstash persistent queues (PQ) can buffer accepted events on disk across restarts, subject to queue durability configuration and storage integrity. PQ does not turn every source into exactly-once delivery. Acknowledgement boundaries and downstream retried deliveries can still cause duplicates.","Dead letter queues capture selected events failing certain processing/output paths, not every failure automatically. Review DLQ support, capacity and retention; failed Elasticsearch mapping writes must be observable. Monitor queue size, blocked inputs, worker utilization and output failures.","Plan disk headroom, batch size, pipeline workers and recovery sequence. For high throughput, test backpressure by pausing Elasticsearch and observing source ack/retry rather than assuming no data is lost."],"sample":"# Example logstash.yml fragments (isolated lab only):\nqueue.type: persisted\nqueue.max_bytes: 1gb\ndead_letter_queue.enable: true\n# Then verify actual queue and DLQ paths plus disk capacity.","language":"configuration","trace":["Draw source → PQ → filter → output ACK boundary.","Simulate downstream outage in a test environment.","Explain at-least-once replay and deduplication keys.","Verify observable result","Document constraints / rollback"],"checks":["Draw source → PQ → filter → output ACK boundary.","Simulate downstream outage in a test environment.","Explain at-least-once replay and deduplication keys."],"quiz":[["Does a persistent queue guarantee exactly-once delivery?","No; retries/replays can still cause duplicates without end-to-end idempotency."]]},"elk-shard-sizing-rollover-and-capacity-math":{"explain":["Shard count is an architecture tradeoff: each shard consumes metadata, search coordination overhead and segment resources; huge shards can slow recoveries while many tiny shards waste resources. Plan around measured data volume, retention, ingestion rate, query profile and relocation targets.","Capacity arithmetic starts from raw daily size × retained days × (primaries + replicas), then adds indexing/translog/merge overhead, growth and free space for relocation. Storage tier placement and compression vary per workload; never sell a single magic shard size as universal.","Rollover and index templates control new backing indices; ILM or data stream lifecycle manages retention. Observe _cat/shards, allocation explain and cluster disk watermarks to distinguish too many shards from allocation blockers."],"sample":"# Authenticated disposable Elastic cluster, Kibana Dev Tools:\nGET _cat/indices?v&s=store.size:desc\nGET _cat/shards?v\nGET _cluster/health\nGET _cluster/allocation/explain","language":"bash","trace":["Calculate 30 days of 4 GiB/day at one replica before overhead.","Explain why replica count affects storage.","Identify one reason a shard stays unassigned.","Verify observable result","Document constraints / rollback"],"checks":["Calculate 30 days of 4 GiB/day at one replica before overhead.","Explain why replica count affects storage.","Identify one reason a shard stays unassigned."],"quiz":[["Is shard count chosen solely from daily log bytes?","No; search patterns, recovery cost, overhead, nodes, data tiers and retention matter."]]},"postgres-locking-matrices-and-blocked-sessions":{"explain":["PostgreSQL MVCC readers and writers usually interact through version visibility, but lock conflicts still occur for table DDL, row updates and other operations. Locks have compatibility rules: ACCESS EXCLUSIVE conflicts broadly, while less restrictive modes permit more concurrency.","Use pg_stat_activity and pg_blocking_pids(pid) to identify the blocker, SQL text, wait_event and transaction age. An idle in transaction session can retain locks and old snapshots, causing long blocking and vacuum bloat.","Never kill a blocker solely because it appears at the top of a list. Determine business impact, transaction ownership, retry safety, workload timeout and authorization before cancellation/termination."],"sample":"SELECT pid,state,wait_event_type,wait_event,\n       pg_blocking_pids(pid) AS blocked_by,\n       now()-xact_start AS xact_age\nFROM pg_stat_activity\nWHERE datname=current_database() ORDER BY xact_start NULLS LAST;","language":"sql","trace":["Map a two-session UPDATE conflict.","Explain difference between cancel and terminate backend.","Investigate idle-in-transaction without automatic intervention.","Verify observable result","Document constraints / rollback"],"checks":["Map a two-session UPDATE conflict.","Explain difference between cancel and terminate backend.","Investigate idle-in-transaction without automatic intervention."],"quiz":[["What PostgreSQL built-in reports blocking backends?","pg_blocking_pids(pid)."]]},"postgres-replication-slots-and-wal-retention-incidents":{"explain":["Replication slots prevent prematurely removing WAL or row changes still needed by a consumer. Physical slots protect replica WAL; logical slots track decoding positions for subscribers. A stalled or abandoned slot can cause indefinite WAL retention and disk exhaustion.","Monitor restart_lsn, confirmed_flush_lsn, pg_wal_lsn_diff against current WAL position, plus replication and archive health. Slots are not necessarily proof the subscriber has applied data. Failover slot support depends on version and configuration.","Before dropping a slot, verify it is truly unused and understand the consequence: the consumer may require reinitialization. Pair WAL retention limits and alerting with backup and replication planning."],"sample":"SELECT slot_name,slot_type,active,restart_lsn,confirmed_flush_lsn\nFROM pg_replication_slots;\nSELECT pg_current_wal_lsn();\nSELECT * FROM pg_stat_replication;","language":"sql","trace":["Estimate retained WAL bytes from LSN difference.","Describe effect of disconnected replica with a slot.","Plan safe stale-slot investigation, not blind deletion.","Verify observable result","Document constraints / rollback"],"checks":["Estimate retained WAL bytes from LSN difference.","Describe effect of disconnected replica with a slot.","Plan safe stale-slot investigation, not blind deletion."],"quiz":[["Why can WAL fill the disk on an otherwise idle primary?","Stalled replication slots or failed archive/retention paths can pin WAL segments."]]},"ops-disaster-recovery-verification-evidence":{"explain":["A disaster recovery plan must distinguish backup creation from successful restoration. Record the recovery point, encryption keys, backup repository, service dependencies, authentication material, supported software versions, data consistency checks and application test procedure.","For a measured drill, start a timer at incident detection; restore to an isolated environment, bring up database/services, validate representative customer journeys, compare hash/document counts and note any missing WAL or snapshots. This measured elapsed time—not the decompression time alone—is the observed RTO.","RPO is the distance between incident time and last recoverable consistent point. Review archive gaps, snapshot success, offsite replication and intentionally induced failure modes. Keep immutable audit evidence without leaking secrets."],"sample":"date -u +%FT%TZ\n# Controlled tabletop evidence (no production changes)\n# Identify backups, last success, recoverable time, restore target,\n# version compatibility, encryption-key custody, application checks.","language":"bash","trace":["Compute RPO and RTO from mock timestamps.","List at least five required restoration dependencies.","Prove an isolated restore meets data and app checks.","Verify observable result","Document constraints / rollback"],"checks":["Compute RPO and RTO from mock timestamps.","List at least five required restoration dependencies.","Prove an isolated restore meets data and app checks."],"quiz":[["What makes an RTO claim credible?","A timed end-to-end recovery rehearsal including application validation and access restoration."]]}},"glossary":{"EEVDF":"Earliest Eligible Virtual Deadline First: Linux fair scheduler method using lag eligibility and virtual deadlines.","vruntime":"Weighted virtual runtime used to reason about relative CPU service received by a fair task.","Futex":"Fast userspace mutex primitive; kernel assists when threads contend or require wakeups.","ASID":"Address space identifier used by some architectures to associate TLB translations with an address space.","TLB shootdown":"Coordinated invalidation of stale translation entries on relevant CPUs.","Working set":"Set of pages actively referenced in a recent interval; used to reason about locality and thrashing.","Thrashing":"Excessive page replacement/reclaim where useful work falls and paging overhead dominates.","NUMA":"Non-uniform memory access: memory latency/bandwidth depend on relative CPU and memory location.","PCID":"Process context identifier used on suitable x86 CPUs for identifying TLB translations.","Softirq":"Kernel deferred processing mechanism used for activities including networking.","NAPI":"Linux network receive mechanism based on interrupt mitigation and polling.","Spinlock":"Mutual exclusion primitive where waiters spin instead of sleeping, used for short critical sections.","RCU":"Read-copy-update synchronization, supporting many readers with deferred reclamation.","Compaction":"Migration/coalescing to free contiguous physical memory pages for high-order allocations.","Buddy allocator":"Physical page allocator organized in power-of-two page blocks.","SLUB":"Linux slab allocator implementation for caches of kernel objects.","FUSE":"Filesystem in Userspace: protocol allowing filesystem logic outside kernel space.","OverlayFS":"Union filesystem layer with lower and upper directories commonly used by containers.","FQDN":"Fully qualified domain name in DNS hierarchy.","NDP":"Neighbor Discovery Protocol used with IPv6.","Conntrack":"Connection-tracking subsystem recording protocol/flow state for firewalling and NAT.","SCHED_DEADLINE":"Linux real-time scheduling class with deadline/runtime/period reservations.","IRQ":"Interrupt request signal/event requiring CPU attention.","NMI":"Non-maskable interrupt, often used for urgent hardware/debug events.","GRO":"Generic Receive Offload: network receive aggregation for reduced processing overhead.","WAL archive":"Durable archived PostgreSQL write-ahead log segments needed for continuity and PITR.","PostgreSQL HOT":"Heap-only tuple update avoiding new index entries when eligibility conditions hold.","TOAST":"PostgreSQL storage for oversized tuple attributes, including compression/out-of-line values.","FSM":"PostgreSQL free space map recording available page space in relations.","Visibility map":"PostgreSQL relation map describing pages whose tuples are all-visible/all-frozen.","Replication slot":"State that prevents removing required WAL/decoding history until consumer advances.","PgBouncer":"Connection pooling middleware often used to limit PostgreSQL backend connection overhead.","SSI":"Serializable Snapshot Isolation, PostgreSQL strategy detecting dangerous serialization conflicts.","LSM tree":"Log-structured merge tree used by some storage engines (not PostgreSQL heap layout).","Lucene segment":"Immutable search index segment periodically refreshed/merged by Elasticsearch/Lucene.","Translog":"Elasticsearch transaction log helping local shard recovery between persisted commit points.","DLQ":"Dead letter queue retaining supported failed pipeline events for later inspection/reprocessing.","SLM":"Snapshot Lifecycle Management in Elasticsearch for scheduled snapshots and retention.","Rollover":"Switch indexing to a new backing index after size/age/doc thresholds or other configured rules.","Hot shard":"Shard bearing disproportionate indexing/search workload, causing bottlenecks.","Ansible handler":"Task activated by a notify event when another task reports changed state.","Execution environment":"Ansible containerized execution context with pinned automation dependencies.","LEGB":"Python name resolution: Local, Enclosing, Global, Builtins.","TaskGroup":"Python asyncio structured concurrency construct grouping task lifetime and failure.","GIL":"CPython global interpreter lock in builds using it; runtime/build-dependent.","PITR target":"Chosen timeline point—e.g., time or LSN—at which PostgreSQL WAL replay should stop.","DAC":"Discretionary access control, such as Unix ownership, permission bits and ACL.","MAC":"Mandatory access control, such as SELinux type enforcement."}};
for(const [id,m] of Object.entries(E.topics)){const l=D.lessons.find(x=>x.id===id);if(!l)throw Error('Missing supplementary masterclass: '+id);l.master=m;l.deep=true;l.depth='masterclass';l.level='Masterclass';}
Object.assign(D.glossary,E.glossary);
D.expansionSummary.masterclasses=D.lessons.filter(x=>x.master).length;
})();

</script>
<script>
/* ARTHA Academy: dependency-free, static, offline-friendly frontend */
(() => {
  'use strict';
  const D = window.ARTHA_DATA;
  if (!D) { document.getElementById('main').textContent='Course data could not be loaded. Check that data.js is alongside index.html.'; return; }
  const main = document.getElementById('main');
  const nav = document.getElementById('trackNav');
  const breadcrumb = document.getElementById('breadcrumb');
  const search = document.getElementById('searchInput');
  const themeButton = document.getElementById('themeToggle');
  const sidebar = document.getElementById('sidebar');
  const byTrack = new Map(D.tracks.map(t => [t.id, D.lessons.filter(l => l.track === t.id)]));
  const byId = new Map(D.lessons.map(l => [l.id, l]));
  const safeGet = (key, fallback) => { try {return localStorage.getItem(key) || fallback;} catch(e) {return fallback;} };
  const safeSet = (key,val) => { try {localStorage.setItem(key,val)} catch(e) {} };
  let completed = new Set(JSON.parse(safeGet('artha_complete_v1','[]')));
  let bookmarked = new Set(JSON.parse(safeGet('artha_bookmarks_v2','[]')));
  let checklist = JSON.parse(safeGet('artha_checklist_v2','{}'));
  const notesKey = id => 'artha_notes_v2_'+id;
  const masterCount = () => D.lessons.filter(x=>x.master).length;
  const viewCount = () => D.lessons.filter(x=>x.deep).length;
  let currentPage = 'home';
  let currentTrack = '';
  let currentLesson = '';
  const escape = value => String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const inline = value => escape(value).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
  const getTrack = id => D.tracks.find(t=>t.id===id);
  const percent = id => {const xs=byTrack.get(id)||[];return xs.length? Math.round(100*xs.filter(l=>completed.has(l.id)).length/xs.length):0;};
  const numDone = () => D.lessons.filter(l=>completed.has(l.id)).length;
  const trackUrl = id => '#/track/'+encodeURIComponent(id);
  const lessonUrl = id => '#/lesson/'+encodeURIComponent(id);
  const btn = (url,txt,cl='btn') => `<a class="${cl}" href="${url}">${txt}</a>`;
  const progress = pct => `<div class="progress-bar" aria-label="${pct}% complete"><div style="width:${pct}%"></div></div>`;
  function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('visible'),2300);}
  function go(url){location.hash=url;if(location.hash===url)render();}
  function renderNav(){
    document.getElementById('trackTotal').textContent=D.tracks.length;
    nav.innerHTML=D.tracks.map(t=>`<a class="track-link ${currentTrack===t.id?'active':''}" href="${trackUrl(t.id)}"><span class="ticon">${t.icon}</span><span>${escape(t.title)}</span><span class="track-count">${(byTrack.get(t.id)||[]).length}</span></a>`).join('');
    document.querySelectorAll('.side-action').forEach(b=>b.classList.toggle('active',b.dataset.view===currentPage));
  }
  function overview(){
    const first = D.lessons.find(l=>!completed.has(l.id));
    const hero = `<section class="hero"><div class="eyebrow">THE SYSTEMS ENGINEERING ENCYCLOPEDIA · EDITION 2</div><h1>Linux, kernel & infrastructure.<br>From first principles to recovery.</h1><p class="subtitle">An expanded offline academy covering the operating system, kernel internals, Red Hat certification workflows, Python engineering, Elastic Stack and PostgreSQL DBA. Read the mechanism, explore architecture flows, perform isolated labs, verify evidence and practice interviews.</p><div class="hero-actions">${btn('#/curriculum','Explore curriculum →','btn primary')}${btn(first?lessonUrl(first.id):'#/curriculum','Continue learning')}${btn('#/simulators','Open OS simulators')}${btn('#/masterclasses','Deep masterclasses')}</div></section>`;
    const pct=Math.round(100*numDone()/D.lessons.length);
    const stats=`<section class="grid stats"><div class="stat"><strong>${D.tracks.length}</strong><label>Learning tracks</label></div><div class="stat"><strong>${D.lessons.length}</strong><label>Topic-wise lessons</label></div><div class="stat"><strong>${masterCount()}</strong><label>Authored masterclasses</label></div><div class="stat"><strong>${pct}%</strong><label>Your completion</label>${progress(pct)}</div></section>`;
    const cards = `<section class="grid track-grid">${D.tracks.map(t=>{
      const arr=byTrack.get(t.id);return `<article class="card"><div class="card-icon">${t.icon}</div><h3>${escape(t.title)}</h3><p>${escape(t.description)}</p><div class="meta"><span>${arr.length} chapters</span><span>${escape(t.level)}</span></div>${progress(percent(t.id))}<div style="margin-top:17px">${btn(trackUrl(t.id),'Open track →','btn small')}</div></article>`;
    }).join('')}</section>`;
    const path=`<div class="heading-row"><div><h2>Recommended learning sequence</h2><p>Start with fundamentals, then specialize in administration and reliability.</p></div></div><div class="path-list">${[
    ['01','Operating Systems → Linux Internals','Process lifecycle, scheduling, virtual memory, paging, boot and I/O.'],
    ['02','RHCSA → RHCE','Build and manage RHEL hosts, then automate reproducibly with Ansible.'],
    ['03','Python → ELK → PostgreSQL','Write automation, build log pipelines and administer transactional data.'],
    ['04','Kernel → Production Operations','Explore scheduler/MM internals and prove recoverability with disaster-recovery labs.']].map(i=>`<div class="path"><span class="eyebrow">STEP ${i[0]}</span><h4>${i[1]}</h4><span class="footer-note">${i[2]}</span></div>`).join('')}</div>`;
    main.innerHTML=hero+stats+`<div class="heading-row"><div><h2>Explore the learning tracks</h2><p>Every lesson includes a workflow diagram, verification commands, a practical assignment and review question.</p></div><span class="pill">No sign-in · No tracking</span></div>`+cards+path+`<section class="lesson-panel" style="margin-top:26px"><span class="section-label">Learning note</span><h3>Hands-on commands run on your own lab machine</h3><p>This static website does not execute Linux, Ansible, Elasticsearch or PostgreSQL commands. Use disposable VMs or a designated lab. The short guided chapters provide topic coverage; the extended deep dives provide substantially more mechanism, calculations and recovery detail.</p></section>`;
  }
  function trackView(t){
    const all=byTrack.get(t.id);
    const deep=all.filter(l=>l.deep).length;
    main.innerHTML=`<section class="module-header"><div class="back">${btn('#/curriculum','← All tracks','btn small ghost')}</div><div class="eyebrow">${escape(t.level)} · ${all.length} topics</div><h1>${t.icon} ${escape(t.title)}</h1><p class="subtitle">${escape(t.description)}</p><div class="tag-list"><span class="pill">${all.length} guided topics</span><span class="pill deep">${deep} deep dives / masterclasses</span><span class="pill">${percent(t.id)}% completed</span></div>${progress(percent(t.id))}</section><div class="heading-row"><div><h2>Chapters, in learning order</h2><p>Open any chapter or work sequentially from top to bottom.</p></div></div><section class="topic-list">${all.map(l=>topicRow(l)).join('')}</section>`;
  }
  function topicRow(l){const t=getTrack(l.track);return `<a class="topic-row" href="${lessonUrl(l.id)}"><span class="num">${String(l.index).padStart(2,'0')}</span><span class="topic-info"><strong>${escape(l.title)}</strong><small>${escape(l.description)}</small></span>${l.master?'<span class="pill deep">Masterclass</span>':l.deep?'<span class="pill deep">Deep dive</span>':''}${completed.has(l.id)?'<span class="check" title="Completed">✓</span>':'<span class="arrow">›</span>'}</a>`;}
  function flowMarkup(l){return `<div class="flow-diagram" aria-label="${escape(l.title)} workflow"><div class="flow-nodes">${l.flow.map((f,i)=>`<div class="flow-node"><div>${escape(f)}</div><small>Stage ${i+1}</small></div>${i<l.flow.length-1?'<span class="flow-arrow">➜</span>':''}`).join('')}</div><div class="diagram-caption">Conceptual workflow · follow stages from left to right. Real implementations may have branches and feedback loops.</div></div>`;}

  // Pure scheduler function, exported for automated and classroom tests.
  function simulateScheduler(input,algo='FCFS',quantum=2){
    const p=input.map((x,i)=>({id:x.id,arrival:x.arrival,burst:x.burst,remaining:x.burst,idx:i,first:null,completion:null}));
    if(!p.length||p.length>12||p.some(x=>!Number.isInteger(x.arrival)||x.arrival<0||x.arrival>100||!Number.isInteger(x.burst)||x.burst<1||x.burst>50))throw Error('Use 1–12 processes; arrival 0–100 and burst 1–50, all integers.');
    const segments=[];let t=0,finished=0,guard=0;
    const log=(id,start,end)=>{if(start===end)return;const last=segments[segments.length-1];if(last&&last.id===id&&last.end===start)last.end=end;else segments.push({id,start,end});};
    const run=(job,duration)=>{const start=t;if(job.first===null)job.first=t;t+=duration;job.remaining-=duration;log(job.id,start,t);if(job.remaining===0){job.completion=t;finished++;}};
    if(algo==='RR'){
      const sorted=[...p].sort((a,b)=>a.arrival-b.arrival||a.idx-b.idx),queue=[];let k=0;
      const arrivals=()=>{while(k<sorted.length&&sorted[k].arrival<=t){queue.push(sorted[k++]);}};
      while(finished<p.length){if(++guard>5000)throw Error('Simulation step limit exceeded.');arrivals();if(!queue.length){const next=sorted[k];log('IDLE',t,next.arrival);t=next.arrival;arrivals();}const cur=queue.shift();run(cur,Math.min(quantum,cur.remaining));arrivals();if(cur.remaining>0)queue.push(cur);}
    } else if(algo==='SRTF'){
      while(finished<p.length){if(++guard>5000)throw Error('Simulation step limit exceeded.');let ready=p.filter(x=>x.remaining>0&&x.arrival<=t);if(!ready.length){const next=Math.min(...p.filter(x=>x.remaining>0).map(x=>x.arrival));log('IDLE',t,next);t=next;continue;}ready.sort((a,b)=>a.remaining-b.remaining||a.arrival-b.arrival||a.idx-b.idx);run(ready[0],1);}
    } else {
      while(finished<p.length){if(++guard>5000)throw Error('Simulation step limit exceeded.');let ready=p.filter(x=>x.remaining>0&&x.arrival<=t);if(!ready.length){const next=Math.min(...p.filter(x=>x.remaining>0).map(x=>x.arrival));log('IDLE',t,next);t=next;continue;}ready.sort((a,b)=>algo==='SJF'?(a.remaining-b.remaining||a.arrival-b.arrival||a.idx-b.idx):(a.arrival-b.arrival||a.idx-b.idx));run(ready[0],ready[0].remaining);}
    }
    return {segments,processes:p.map(x=>({id:x.id,arrival:x.arrival,burst:x.burst,first:x.first,completion:x.completion,turnaround:x.completion-x.arrival,waiting:x.completion-x.arrival-x.burst,response:x.first-x.arrival})),total:t};
  }
  function simulatePages(refs,frames,algorithm){
    if(!refs.length||refs.length>60||refs.some(x=>!Number.isInteger(x)||x<0||x>999)||!Number.isInteger(frames)||frames<1||frames>8)throw Error('Use 1–60 page numbers (0–999) and 1–8 frames.');
    const slots=Array(frames).fill(null);const oldest=Array(frames).fill(0),recent=Array(frames).fill(0);let faults=0,hits=0;
    const history=refs.map((page,t)=>{const hit=slots.indexOf(page);let victim=-1;if(hit>=0){hits++;recent[hit]=t+1;}else{faults++;victim=slots.indexOf(null);if(victim<0){let metric=algorithm==='LRU'?recent:oldest;victim=metric.indexOf(Math.min(...metric));}slots[victim]=page;oldest[victim]=t+1;recent[victim]=t+1;}return {page,hit:hit>=0,slots:[...slots],victim};});
    return {history,faults,hits,rate:Math.round(100*faults/refs.length)};
  }

    <div class="sim-grid" style="margin-top:30px"><section class="lesson-panel" id="schedSection"><span class="section-label">LAB 01 · CPU SCHEDULING</span><h2>FCFS, SJF, SRTF & Round Robin</h2><p>Format: <code>Process,Arrival,Burst</code>, one per semicolon. Single CPU; all bursts are CPU-only; switch cost is zero.</p><div class="lab-controls"><div class="input-group" style="width:100%"><label for="processes">Processes</label><input class="lab-input" id="processes" style="flex:1" value="P1,0,7; P2,2,4; P3,4,1"></div><div class="input-group"><label for="algorithm">Algorithm</label><select class="lab-input" id="algorithm"><option>FCFS</option><option>SJF</option><option>SRTF</option><option>RR</option></select></div><div class="input-group"><label for="quantum">Quantum</label><input class="lab-input" id="quantum" type="number" min="1" max="50" value="2" style="width:70px"></div><button class="btn primary" data-action="calc-sched">Run simulation</button></div><div id="schedResult"></div></section>
    <section class="lesson-panel" id="pagesSection"><span class="section-label">LAB 02 · MEMORY REPLACEMENT</span><h2>FIFO versus LRU page replacement</h2><p>For each page reference, show frame contents and identify hit/miss. LRU uses exact last-access time; real kernels use more complex reclaim.</p><div class="lab-controls"><div class="input-group" style="width:100%"><label for="pages">References</label><input class="lab-input" id="pages" style="flex:1" value="7,0,1,2,0,3,0,4,2,3,0,3,2"></div><div class="input-group"><label for="frameCount">Frames</label><input class="lab-input" id="frameCount" type="number" min="1" max="8" value="3" style="width:66px"></div><div class="input-group"><label for="pageAlgo">Policy</label><select class="lab-input" id="pageAlgo"><option>FIFO</option><option>LRU</option></select></div><button class="btn primary" data-action="calc-pages">Run simulation</button></div><div id="pagesResult"></div></section></div>
    <section class="lesson-panel" style="margin-top:18px"><span class="section-label">LAB 03 · ADDRESS TRANSLATION</span><h2>Virtual page number → physical frame</h2><p>Assume a single-level conceptual page mapping with a present page-table entry. Translation is arithmetic; it does not model a full TLB/page walk.</p><div class="lab-controls"><div class="input-group"><label for="virtAddr">Virtual address (decimal)</label><input class="lab-input" id="virtAddr" type="number" min="0" max="9007199254740990" value="12345"></div><div class="input-group"><label for="pageSize">Page size (bytes)</label><select class="lab-input" id="pageSize"><option value="4096">4096 (4 KiB)</option><option value="2097152">2097152 (2 MiB)</option></select></div><div class="input-group"><label for="frameNo">Mapped frame</label><input class="lab-input" id="frameNo" type="number" min="0" max="100000" value="9"></div><button class="btn primary" data-action="calc-address">Translate</button></div><div id="addressResult"></div></section>
    <div class="sim-grid">
      <section class="lesson-panel"><span class="section-label">LAB 04 · DEADLOCK AVOIDANCE</span><h2>Banker's safe-state checker</h2><p>Enter available resource vector and per-process Allocation/Max matrices (semicolon between processes; spaces between resource types). Example is a five-process, three-resource textbook instance.</p>
      <div class="lab-controls"><label class="input-group">Available <input id="bankAvailable" class="lab-input" value="3 3 2"></label><label class="input-group" style="width:100%">Allocation <input id="bankAllocated" class="lab-input" style="flex:1" value="0 1 0;2 0 0;3 0 2;2 1 1;0 0 2"></label><label class="input-group" style="width:100%">Max <input id="bankMax" class="lab-input" style="flex:1" value="7 5 3;3 2 2;9 0 2;2 2 2;4 3 3"></label><button class="btn primary" data-action="calc-banker">Find safe sequence</button></div><div id="bankerResult"></div></section>
      <section class="lesson-panel"><span class="section-label">LAB 05 · TRANSLATION CACHE</span><h2>TLB effective access time</h2><p>Textbook simplified model: TLB lookup on every reference; hit requires one RAM access; miss requires a two-access page-table walk plus data. Page faults, caches and multilevel page tables excluded.</p>
      <div class="lab-controls"><label class="input-group">TLB hit ratio (%) <input id="tlbRate" type="number" min="0" max="100" value="95" class="lab-input" style="width:85px"></label><label class="input-group">TLB lookup (ns) <input id="tlbNs" type="number" min="0" value="10" class="lab-input" style="width:75px"></label><label class="input-group">RAM access (ns) <input id="ramNs" type="number" min="1" value="100" class="lab-input" style="width:75px"></label><button class="btn primary" data-action="calc-tlb">Calculate access time</button></div><div id="tlbResult"></div></section>
    </div>
    <section class="lesson-panel"><span class="section-label">LAB 06 · PARALLEL PROCESSING</span><h2>Amdahl's law / multicore speedup</h2><p>If fraction p of a program is parallelizable and the rest is inherently serial, the idealized speedup with N processors is 1 / ((1 − p) + p/N). This excludes scheduling and communication overhead.</p>
    <div class="lab-controls"><label class="input-group">Parallel share (%) <input id="amdahlPct" type="number" min="0" max="100" value="90" class="lab-input" style="width:75px"></label><label class="input-group">CPUs <input id="amdahlCpus" type="number" min="1" max="1024" value="8" class="lab-input" style="width:75px"></label><button class="btn primary" data-action="calc-amdahl">Calculate speedup</button></div><div id="amdahlResult"></div></section>
    <section class="lesson-panel"><h3>What to compare</h3><p>Scheduling: arrival order changes average waiting; SRTF adds preemption; Round Robin trades response time against switch frequency. Paging: locality influences fault rates and FIFO may show Belady anomaly. Translation: changing page size changes the split between VPN and offset, while the assigned frame changes physical address.</p><div class="tag-list">${btn(lessonUrl('os-cpu-scheduling-fundamentals'),'Study scheduling','btn small')}${btn(lessonUrl('os-paging-and-page-tables'),'Study paging','btn small')}${btn(lessonUrl('os-fifo-lru-and-page-replacement'),'Study replacement','btn small')}</div></section>`;
    updateSched();updatePages();updateAddress();updateBanker();updateTLB();updateAmdahl();
  }
  function getProcesses(){const str=document.getElementById('processes').value.trim();const chunks=str.split(';').map(s=>s.trim()).filter(Boolean);if(chunks.length>12)throw Error('At most 12 processes.');return chunks.map((s,i)=>{const v=s.split(',').map(x=>x.trim());if(v.length!==3||!/^[-\w]+$/.test(v[0]))throw Error('Use P1,0,7; P2,2,4 format.');return {id:v[0],arrival:Number(v[1]),burst:Number(v[2])};});}
  function updateSched(){const el=document.getElementById('schedResult');if(!el)return;try{const p=getProcesses();if(new Set(p.map(x=>x.id)).size!==p.length)throw Error('Process names must be unique.');const a=document.getElementById('algorithm').value;const q=Number(document.getElementById('quantum').value);if(!Number.isInteger(q)||q<1||q>50)throw Error('Quantum must be 1–50.');const out=simulateScheduler(p,a,q);const avg=(k)=>(out.processes.reduce((s,p)=>s+p[k],0)/out.processes.length).toFixed(2);el.innerHTML=`<div class="tag-list"><span class="pill">Average waiting: ${avg('waiting')}</span><span class="pill">Avg turnaround: ${avg('turnaround')}</span><span class="pill">Avg response: ${avg('response')}</span></div><h4>CPU Gantt chart</h4><div class="gantt">${out.segments.map(x=>`<div class="gantt-block" style="--n:${x.end-x.start}" title="${escape(x.id)}: t=${x.start} to ${x.end}">${escape(x.id)}<small>${x.end}</small></div>`).join('')}</div><div class="matrix"><table><thead><tr><th>Process</th><th>Arrival</th><th>Burst</th><th>First CPU</th><th>Completion</th><th>Waiting</th><th>Turnaround</th><th>Response</th></tr></thead><tbody>${out.processes.map(x=>`<tr><td><strong>${escape(x.id)}</strong></td><td>${x.arrival}</td><td>${x.burst}</td><td>${x.first}</td><td>${x.completion}</td><td>${x.waiting}</td><td>${x.turnaround}</td><td>${x.response}</td></tr>`).join('')}</tbody></table></div><p class="footer-note">Turnaround = completion − arrival; waiting = turnaround − burst; response = first start − arrival. Switch cost excluded.</p>`;}catch(e){el.innerHTML=`<div class="callout warning">${escape(e.message)}</div>`;}}
  function updatePages(){const el=document.getElementById('pagesResult');if(!el)return;try{const str=document.getElementById('pages').value;const nums=str.split(/[\s,;]+/).filter(Boolean);if(!nums.length||nums.some(v=>!/^[0-9]+$/.test(v)))throw Error('Enter nonnegative integer references separated by commas.');const refs=nums.map(Number),frames=Number(document.getElementById('frameCount').value),algo=document.getElementById('pageAlgo').value,out=simulatePages(refs,frames,algo);el.innerHTML=`<div class="tag-list"><span class="pill">Faults: ${out.faults}</span><span class="pill">Hits: ${out.hits}</span><span class="pill">Fault rate: ${out.rate}%</span></div><div class="matrix"><table class="page-table"><thead><tr><th>Reference</th>${out.history.map((x)=>`<th>${x.page}</th>`).join('')}</tr></thead><tbody>${Array.from({length:frames},(_,f)=>`<tr><th>Frame ${f+1}</th>${out.history.map(x=>`<td class="${x.hit?'hit':'fault'}">${x.slots[f]===null?'–':x.slots[f]}</td>`).join('')}</tr>`).join('')}<tr><th>Result</th>${out.history.map(x=>`<td>${x.hit?'H':'F'}</td>`).join('')}</tr></tbody></table></div><p class="footer-note">H = hit; F = fault. Each column is the frame state immediately after accessing that reference.</p>`;}catch(e){el.innerHTML=`<div class="callout warning">${escape(e.message)}</div>`;}}
  function updateAddress(){const el=document.getElementById('addressResult');if(!el)return;const va=Number(document.getElementById('virtAddr').value),size=Number(document.getElementById('pageSize').value),frame=Number(document.getElementById('frameNo').value);if(!Number.isSafeInteger(va)||va<0||!Number.isSafeInteger(frame)||frame<0||frame>100000){el.innerHTML='<div class="callout warning">Enter a safe nonnegative integer address and frame (0–100000).</div>';return;}const vpn=Math.floor(va/size),offset=va%size,pa=frame*size+offset;el.innerHTML=`<div class="flow-diagram"><div class="flow-nodes"><div class="flow-node">Virtual address<small>${va}</small></div><span class="flow-arrow">➜</span><div class="flow-node">VPN ${vpn}<small>Offset ${offset}</small></div><span class="flow-arrow">➜</span><div class="flow-node">Page-table lookup<small>VPN ${vpn} → Frame ${frame}</small></div><span class="flow-arrow">➜</span><div class="flow-node">Physical address<small>${pa}</small></div></div></div><p><code>VPN = floor(${va}/${size}) = ${vpn}</code><br><code>offset = ${va} % ${size} = ${offset}</code><br><code>PA = ${frame} × ${size} + ${offset} = ${pa}</code></p>`;}
  function simulateBanker(available,allocation,maximum){
    const p=allocation.length,resources=available.length;
    if(p<1||p>12||resources<1||resources>8||maximum.length!==p||!allocation.every(row=>row.length===resources)||!maximum.every(row=>row.length===resources))throw Error('Use 1–12 processes with equal resource-vector lengths (1–8).');
    const valid=x=>Number.isInteger(x)&&x>=0&&x<=10000;
    if(![...available,...allocation.flat(),...maximum.flat()].every(valid))throw Error('All resource counts must be integers in range 0–10000.');
    const need=allocation.map((row,i)=>row.map((v,j)=>maximum[i][j]-v));
    if(need.some(row=>row.some(v=>v<0)))throw Error('A process cannot have Allocation exceeding Max.');
    const work=available.slice(),done=Array(p).fill(false),sequence=[],steps=[];
    for(let pass=0;pass<p;pass++){
      let found=-1;
      for(let i=0;i<p;i++)if(!done[i]&&need[i].every((v,j)=>v<=work[j])){found=i;break;}
      if(found<0)break;
      const before=[...work];for(let j=0;j<resources;j++)work[j]+=allocation[found][j];
      done[found]=true;sequence.push(found);steps.push({process:found,before,after:[...work],need:need[found]});
    }
    return {safe:sequence.length===p,sequence,steps,remaining:done.map((v,i)=>v?null:i).filter(x=>x!==null),need};
  }
  function parseVector(s){const parts=s.trim().split(/[\s,]+/).filter(Boolean);if(!parts.length||parts.some(x=>!/^\d+$/.test(x)))throw Error('Enter nonnegative whole numbers separated by spaces.');return parts.map(Number);}
  function parseMatrix(s){return s.split(';').map(x=>x.trim()).filter(Boolean).map(parseVector);}
  function updateBanker(){const el=document.getElementById('bankerResult');if(!el)return;try{
    const b=simulateBanker(parseVector(document.getElementById('bankAvailable').value),parseMatrix(document.getElementById('bankAllocated').value),parseMatrix(document.getElementById('bankMax').value));
    el.innerHTML=`<div class="tag-list"><span class="pill ${b.safe?'deep':''}">${b.safe?'SAFE STATE':'NO SAFE SEQUENCE FOUND'}</span><span class="pill">${b.safe?b.sequence.map(i=>'P'+i).join(' → '):'Unfinished: '+b.remaining.map(i=>'P'+i).join(', ')}</span></div><div class="matrix"><table><thead><tr><th>Sequence step</th><th>Need</th><th>Work before</th><th>Work after releasing</th></tr></thead><tbody>${b.steps.map((s,i)=>`<tr><td>${i+1} · P${s.process}</td><td>${s.need.join(', ')}</td><td>${s.before.join(', ')}</td><td>${s.after.join(', ')}</td></tr>`).join('')}</tbody></table></div><p class="footer-note">Safety test only. An unsafe state does not prove that deadlock has already occurred; it means this algorithm found no completion sequence under declared Max demands.</p>`;
  }catch(e){el.innerHTML=`<div class="callout warning">${escape(e.message)}</div>`;}}
  function effectiveAccessTime(hitRate,tlb,ram){if(![hitRate,tlb,ram].every(Number.isFinite)||hitRate<0||hitRate>1||tlb<0||ram<=0)throw Error('Invalid hit rate or latencies.');return tlb+(2-hitRate)*ram;}
  function updateTLB(){const el=document.getElementById('tlbResult');if(!el)return;try{
    const p=Number(document.getElementById('tlbRate').value)/100,tlb=Number(document.getElementById('tlbNs').value),ram=Number(document.getElementById('ramNs').value);const v=effectiveAccessTime(p,tlb,ram);
    el.innerHTML=`<h3>${v.toFixed(2)} ns effective access time</h3><p><code>EAT = ${p.toFixed(3)} × (${tlb}+${ram}) + ${(1-p).toFixed(3)} × (${tlb}+2×${ram}) = ${v.toFixed(2)} ns</code></p><p class="footer-note">Page faults, memory caches, multilevel walks and modern hardware optimizations are intentionally excluded.</p>`;
  }catch(e){el.innerHTML=`<div class="callout warning">${escape(e.message)}</div>`;}}
  function amdahl(parallel,cpus){if(!Number.isFinite(parallel)||parallel<0||parallel>1||!Number.isInteger(cpus)||cpus<1||cpus>1024)throw Error('Invalid parallel share or CPU count.');return 1/((1-parallel)+parallel/cpus);}
  function updateAmdahl(){const el=document.getElementById('amdahlResult');if(!el)return;try{
    const p=Number(document.getElementById('amdahlPct').value)/100,cpus=Number(document.getElementById('amdahlCpus').value),s=amdahl(p,cpus);
    el.innerHTML=`<div class="tag-list"><span class="pill">${s.toFixed(2)}× theoretical speedup</span><span class="pill">${(100*s/cpus).toFixed(1)}% idealized scaling efficiency</span></div><p><code>1 / ((1 − ${p.toFixed(2)}) + ${p.toFixed(2)} / ${cpus}) = ${s.toFixed(3)}</code></p>`;
  }catch(e){el.innerHTML=`<div class="callout warning">${escape(e.message)}</div>`;}}
  document.addEventListener('click',ev=>{
    const copy=ev.target.closest('[data-copy]');if(copy){const val=copy.dataset.copy;navigator.clipboard?.writeText(val).then(()=>toast('Command copied')).catch(()=>fallbackCopy(val));if(!navigator.clipboard)fallbackCopy(val);return;}
    const save=ev.target.closest('[data-save-notes]');if(save){const input=document.getElementById('studyNotes');if(input){safeSet(notesKey(save.dataset.saveNotes),input.value);toast('Study notes saved locally');}return;}
    const bm=ev.target.closest('[data-bookmark]');if(bm){const id=bm.dataset.bookmark;if(bookmarked.has(id))bookmarked.delete(id);else bookmarked.add(id);safeSet('artha_bookmarks_v2',JSON.stringify([...bookmarked]));render();toast(bookmarked.has(id)?'Lesson bookmarked':'Bookmark removed');return;}
    if(ev.target.closest('[data-print]')){if(window.print)window.print();return;}
    if(ev.target.closest('[data-export]')){
      const noteObject={};for(const l of D.lessons){const x=safeGet(notesKey(l.id),'');if(x)noteObject[l.id]=x;}
      const blob=new Blob([JSON.stringify({edition:2,exportedAt:new Date().toISOString(),completed:[...completed],bookmarks:[...bookmarked],checklist,notes:noteObject},null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ARTHA_Study_Progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return;
    }
    const done=ev.target.closest('[data-complete]');if(done){const id=done.dataset.complete;if(completed.has(id))completed.delete(id);else completed.add(id);safeSet('artha_complete_v1',JSON.stringify([...completed]));render();toast(completed.has(id)?'Chapter marked complete':'Completion removed');return;}
    const jump=ev.target.closest('[data-jump]');if(jump){ev.preventDefault();document.getElementById(jump.dataset.jump)?.scrollIntoView({behavior:'smooth'});return;}
    const action=ev.target.closest('[data-action]');if(action){({ 'calc-sched': updateSched,'calc-pages':updatePages,'calc-address':updateAddress,'calc-banker':updateBanker,'calc-tlb':updateTLB,'calc-amdahl':updateAmdahl }[action.dataset.action]||(()=>{}))();return;}
    const navbutton=ev.target.closest('[data-view]');if(navbutton){go('#/'+navbutton.dataset.view);}
  });
  function fallbackCopy(value){const ta=document.createElement('textarea');ta.value=value;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Command copied');}catch(e){toast('Select the command manually to copy');}ta.remove();}
  document.addEventListener('change',ev=>{const field=ev.target;if(field.matches?.('[data-lab-check]')){const id=field.dataset.labCheck,i=Number(field.dataset.step);const v=new Set(checklist[id]||[]);if(field.checked)v.add(i);else v.delete(i);checklist[id]=[...v].sort((a,b)=>a-b);safeSet('artha_checklist_v2',JSON.stringify(checklist));toast('Checklist updated');}});
  search.addEventListener('input',()=>{if(search.value.trim())searchResults(search.value);else render();});
  document.addEventListener('keydown',ev=>{if(ev.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){ev.preventDefault();search.focus();}if(ev.key==='Escape'){search.blur();sidebar.classList.remove('open');}});
  document.getElementById('menuToggle').addEventListener('click',()=>sidebar.classList.toggle('open'));
  themeButton.addEventListener('click',()=>{const cur=document.documentElement.dataset.theme;document.documentElement.dataset.theme=cur==='light'?'dark':'light';safeSet('artha_theme',document.documentElement.dataset.theme);});
  document.documentElement.dataset.theme=safeGet('artha_theme','dark');
  window.addEventListener('hashchange',render);
  window.ARTHA_TEST={simulateScheduler,simulatePages,simulateBanker,effectiveAccessTime,amdahl};
  render();
})();

</script>
