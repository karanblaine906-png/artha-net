 "glossary": {
  "PID": "Process identifier assigned by the kernel.",
  "PPID": "Parent process identifier.",
  "Syscall": "Controlled entry from userspace to an operating-system service.",
  "Context switch": "Change of running thread/process context, including CPU state and scheduling effects.",
  "Runnable": "Task eligible to execute once CPU time is available.",
  "Load average": "Exponentially smoothed runnable plus uninterruptible-task demand on Linux.",
  "Nice": "User-visible weight adjustment influencing normal Linux fair scheduling.",
  "EEVDF": "Earliest Eligible Virtual Deadline First: a Linux fair scheduling approach based on lag and virtual deadlines.",
  "TLB": "Translation Lookaside Buffer caching recent virtual-to-physical address mappings.",
  "VPN": "Virtual page number portion of a virtual address.",
  "Page fault": "Trap on a memory access that is not currently mapped/allowed; can be minor, major or invalid.",
  "CoW": "Copy-on-write: defer copying shared data until mutation.",
  "RSS": "Resident set size of a process, with shared pages potentially counted for multiple processes.",
  "PSS": "Proportional set size: a process memory estimate allocating shared pages proportionally.",
  "OOM": "Out of memory: a condition where reclaim cannot satisfy allocations under current limits.",
  "PSI": "Pressure Stall Information measuring time tasks stall due to CPU/memory/I/O pressure.",
  "Inode": "Filesystem object metadata describing a file; directory entries bind names to inodes.",
  "Dentry": "Kernel directory entry cache object used in pathname lookup.",
  "VFS": "Virtual Filesystem Switch, Linux abstraction over filesystem implementations.",
  "LVM": "Logical Volume Manager: physical volumes, volume groups and logical volumes.",
  "SELinux": "Linux Security Module enforcing mandatory access-control policies.",
  "AVC": "Access Vector Cache; also associated with SELinux access-denial audit messages.",
  "Namespace": "Linux kernel scope for isolated resources such as PIDs, mounts or network interfaces.",
  "cgroup": "Control group: accounting and resource limits for groups of processes.",
  "Idempotence": "Reapplying desired-state operation produces no unnecessary new changes after convergence.",
  "Ansible inventory": "Set of managed hosts and groups consumed by automation plays.",
  "Jinja2": "Template expression and control language used by Ansible templates.",
  "Shard": "Unit of distributed Elasticsearch index storage/search.",
  "Replica": "Copy of an Elasticsearch primary shard for resilience/search capacity; not a historical backup.",
  "SLM": "Snapshot Lifecycle Management policy automation in Elasticsearch.",
  "ILM": "Index Lifecycle Management: index rollover and retention policy automation.",
  "ECS": "Elastic Common Schema: common field vocabulary for event data.",
  "WAL": "Write-ahead log of PostgreSQL changes needed for crash recovery and replication.",
  "MVCC": "Multi-version concurrency control using tuple versions and transaction snapshots.",
  "PITR": "Point-in-time recovery using a base backup and WAL replay to a recovery target.",
  "LSN": "Log Sequence Number identifying a position in PostgreSQL WAL.",
  "Vacuum": "PostgreSQL maintenance that reclaims dead tuple space and manages transaction-id age.",
  "RPO": "Recovery Point Objective: maximum acceptable data loss period.",
  "RTO": "Recovery Time Objective: target maximum service recovery time.",

on change canary and rollback.","q":"Explain the internal path and most important tradeoff of production change canary and rollback.","a":"Plan baseline, one-host canary, health gates, feature flags, rollback and postmortem evidence. State the entry point, resource or state updated, observation used to verify it, and a failure condition that would falsify your explanation."},"verify":"Demonstrate production change canary and rollback in a repeatable lab, show a before/after observation and record the expected invariant. Do not change production state to complete the exercise.","flow":["Baseline","Change/fault injection","Observe","Recover","Audit evidence"],"level":"Guided topic"},{"id":"ops-gitops-for-infrastructure-configurations","track":"ops","title":"GitOps for infrastructure configurations","description":"Explain review, reproducible builds, signed changes, drift detection and approval gates.","command":"git status","depth":"guided","deep":false,"detail":{"why":"Explain review, reproducible builds, signed changes, drift detection and approval gates. This lesson connects the user-visible behavior to the underlying data structures, invariants and operational impact.","mechanism":"Explain review, reproducible builds, signed changes, drift detection and approval gates. Production reliability requires baselines, observability, failure isolation, reversible changes and rehearsed recovery, not simply command execution. Trace the concrete resource changes from entry point to final observation. Explicitly distinguish the policy, the mechanism, and what remains persisted or in memory. Where a value is estimated rather than measured, write down the assumption and units.","lab":"Set a measurable SLI/acceptance criterion, inject one controlled failure in a lab, collect evidence and write a rollback sequence. Start with `git status` where applicable. Annotate the output; run a safe comparison and record what changed. Close the exercise with a brief written root-cause explanation.","failure":"Avoid relying on one metric or a single successful backup run. For this chapter specifically, a common failure is concluding that the first visible counter or command result fully represents gitops for infrastructure configurations.","q":"Explain the internal path and most important tradeoff of gitops for infrastructure configurations.","a":"Explain review, reproducible builds, signed changes, drift detection and approval gates. State the entry point, resource or state updated, observation used to verify it, and a failure condition that would falsify your explanation."},"verify":"Demonstrate gitops for infrastructure configurations in a repeatable lab, show a before/after observation and record the expected invariant. Do not change production state to complete the exercise.","flow":["Baseline","Change/fault injection","Observe","Recover","Audit evidence"],"level":"Guided topic"}],"master":{"os-cpu-scheduling-fundamentals":{"explain":["A scheduler decides which runnable task receives the CPU. A task is ready when it could run but has not been selected; a sleeping task waiting for I/O is not runnable. Throughput (jobs/time), turnaround (completion−arrival), waiting (turnaround−CPU time), response (first start−arrival) and jitter measure different qualities. Improving one does not universally optimize the rest.","For FCFS the queue is by arrival; non-preemptive SJF selects the shortest remaining job at each idle decision; SRTF preempts when a shorter remaining job arrives. Round Robin rotates a FIFO ready queue after each time quantum. Priority policies can starve others without aging. All basic examples ignore I/O, interrupts, affinity, multicore topology, cache warming and switching costs.","Worked trace: P1 arrives at 0, needs 7; P2 arrives at 2, needs 4; P3 arrives at 4, needs 1. FCFS runs 0–7 P1, 7–11 P2, 11–12 P3. Completion times: 7,11,12. Turnaround: 7,9,8. Waiting: 0,5,7. Average waiting = (0+5+7)/3 = 4.00 units. Response and waiting differ under preemption. Now use the simulator to verify and compare SRTF."],"trace":["P1 arrives t=0 → starts immediately","P2 arrives t=2 → ready queue","P3 arrives t=4 → ready queue","P1 ends t=7 → P2 runs through t=11","P3 ends t=12 → compute all metrics"],"sample":"processes = [(\"P1\",0,7,7),(\"P2\",2,4,11),(\"P3\",4,1,12)]\nfor name,arrival,burst,complete in processes:\n    tat = complete - arrival\n    wait = tat - burst\n    print(name, \"TAT\",tat,\"wait\",wait)\n# P1 TAT 7 wait 0; P2 TAT 9 wait 5; P3 TAT 8 wait 7","language":"python","checks":["Calculate waiting, turnaround and response separately.","Explain why a job may wait multiple distinct periods in RR.","Distinguish textbook scheduling from Linux EEVDF, deadline and realtime classes."],"quiz":[["Why is response time different from waiting time?","Response is first run minus arrival; waiting accumulates every interval in the ready queue."],["What assumption makes SJF mathematically easy but operationally hard?","Knowing or accurately predicting the next CPU burst."]]},"os-paging-and-page-tables":{"explain":["Virtual memory gives each process its own apparent address space. The MMU translates a virtual page number through page tables to a physical frame number while preserving the lower address bits as the offset. The page table also contains permissions, present/accessed/dirty bits and architecture-specific metadata.","For 4 KiB pages, 12345 ÷ 4096 yields VPN 3, offset 57. If PTE[3] points to frame 9, physical address = 9×4096+57 = 36921. A TLB hit skips a page-table walk. A TLB miss means cached translation absent, NOT necessarily a page fault; a valid resident PTE can resolve the miss. A true page fault causes kernel exception handling, potentially zero-fill, copy-on-write, file read or signal delivery.","A sparse 48-bit process address space does not require a single gigantic flat table. Multilevel structures allocate page-table pages only for populated areas. Huge pages increase TLB reach but may cost more memory or fragmentation. On multicore systems changes to mappings can require TLB invalidations or shootdowns."],"trace":["CPU issues VA = 12345","Split VPN=3, offset=57","TLB lookup → miss","Page table PTE[3] → PFN 9, present","Combine 9×4096+57 → PA=36921"],"sample":"PAGE_SIZE = 4096\nva = 12345\npte = {3: {\"pfn\":9, \"present\":True, \"write\":False}}\nvpn,off = divmod(va,PAGE_SIZE)\nentry = pte[vpn]\nassert entry[\"present\"]\npa = entry[\"pfn\"] * PAGE_SIZE + off\nprint(f\"VPN={vpn}, offset={off}, PA={pa}\") # 3, 57, 36921","language":"python","checks":["Prove TLB miss is not the same as page fault.","Calculate a virtual translation with 2 MiB pages.","Explain protection faults and copy-on-write handling."],"quiz":[["What exactly stays the same in a page translation?","The offset within a page."],["Why use multilevel page tables?","They avoid allocating flat entries for huge unused virtual regions."]]},"os-deadlocks-and-starvation":{"explain":["Deadlock requires a cycle of blocked dependencies, not merely high contention. The classic four Coffman conditions are mutual exclusion, hold-and-wait, no preemption and circular wait. Preventing any one is enough to preclude this class of deadlock.","Wait-for graph: Thread A owns lock L1 and waits for L2, while Thread B owns L2 and waits for L1. Neither can make progress. A lock ordering rule (always acquire L1 then L2) removes the cycle. Starvation is different: a thread could theoretically progress, but policy may repeatedly deny it the resource.","Detection uses lock graphs or timeouts; avoidance uses safe-state reasoning and future resource demands (for example the Banker algorithm). Recovery may require aborting one operation, which introduces data consistency questions. Test failure paths and scope lock duration."],"trace":["A acquires L1","B acquires L2","A waits for L2","B waits for L1","Circular dependency → deadlock"],"sample":"# Safe lock-order pattern (conceptual Python)\nfrom threading import Lock\nfirst, second = Lock(), Lock()\n\ndef operation():\n    with first:\n        with second:\n            return \"critical section completed\"","language":"python","checks":["Draw a wait-for graph and identify the cycle.","Distinguish deadlock, livelock and starvation.","Suggest a lock-order invariant and verify it across callers."],"quiz":[["What is the simplest preventive condition to violate in many programs?","Circular wait: define and follow a global lock acquisition order."]]},"linux-linux-boot-sequence":{"explain":["Boot is a sequence of ownership transitions. UEFI firmware initializes platform devices and chooses a boot entry. A boot manager loads a Linux kernel and initial RAM filesystem; kernel initializes memory management, scheduler, early drivers and basic root mount support.","The initramfs stage may assemble LVM, storage drivers, network root or disk unlocking before switching to the real root filesystem. PID 1 (commonly systemd) resolves unit dependencies and targets and starts the userspace service graph.","A GRUB screen followed by a root mount failure points to a different layer than a correct kernel boot followed by failed sshd. `systemd-analyze critical-chain` investigates service dependencies AFTER userspace init; firmware/bootloader delays need their own evidence. Changes to boot/root mappings are high risk and require console access and a VM snapshot."],"trace":["UEFI + boot entry","GRUB → kernel + initramfs","Kernel memory/scheduler/drivers","initramfs → mount real root","systemd PID1 → target + services"],"sample":"uname -r\ncat /proc/cmdline\nsystemd-analyze time\nsystemd-analyze critical-chain\njournalctl -b -p err --no-pager\nlsblk -f","language":"bash","checks":["Distinguish firmware, bootloader, kernel, initramfs and systemd failures.","Find what partition / is mounted from without modifying it.","Capture a boot journal error and map it to a stage."],"quiz":[["Does initramfs serve as the permanent root filesystem?","Typically no; early userspace switches to the intended root mount."]]},"linux-memory-accounting-rss-vsz-and-cache":{"explain":["VSZ/VIRT is the total virtual address space, including mappings not backed by resident memory. RSS counts resident pages mapped into a process but can double-count shared mappings across processes. PSS apportions shared mapped pages by sharing count and helps account for process memory more fairly.","The OS uses otherwise idle memory for page cache and reclaimable kernel caches, so free memory near zero is not sufficient evidence of distress. Monitor `MemAvailable`, reclaim, swap activity, major faults and memory PSI together. An anonymous memory leak often grows private dirty memory and RSS; cache pressure may keep memory in cache until reclaim.","A cgroup can OOM even when the host reports available memory. Contrast memory.current, memory.max and memory.events against host counters. Interpret snapshots alongside workload and time history."],"trace":["Process maps virtual region","First access faults/allocates page","RSS grows when resident","Shared pages contribute to PSS fraction","Reclaim / cgroup limit may evict or OOM"],"sample":"free -h\ngrep -E \"MemAvailable|Cached|Dirty|Swap\" /proc/meminfo\nps -eo pid,rss,vsz,comm --sort=-rss | head\ncat /proc/pressure/memory\ncat /sys/fs/cgroup/memory.events 2>/dev/null || true","language":"bash","checks":["Explain why RSS totals can exceed used memory.","Differentiate a file cache from a resident anonymous leak.","Correlate PSI with swap and workload latency."],"quiz":[["Why can two processes each report the same shared-memory pages in RSS?","RSS includes all resident mappings per process; sharing is not deducted."]]},"linux-linux-network-data-path":{"explain":["For a user-space TCP send, application bytes enter the kernel through send/write; socket buffering and TCP segmentation hand packets to IP route processing, neighbor resolution, qdisc, driver and NIC. On receive, the NIC/DMA path triggers interrupts or NAPI polls; packets traverse netfilter/routing, TCP receive queue and a user read.","Names are resolved separately through resolver/NSS/DNS. DNS success does not prove routing; routing success does not prove the TCP handshake; an established TCP connection does not prove TLS trust or valid HTTP responses. Debug each boundary in order.","Conntrack state and NAT rules can rewrite addresses; retransmission counters, interface drops and backlog pressure point to distinct bottlenecks. Collect packet traces only with authorization, filter sensitive data and prefer safe sampling."],"trace":["DNS → address","Route + neighbor → L2","TCP SYN/SYN-ACK/ACK","send → TCP/IP → NIC","receive → socket → application"],"sample":"getent ahosts example.com\nip route get 1.1.1.1\nip neigh show\nss -tnpi\ncat /proc/net/netstat | head -4\n# Substitute your authorized test host before trying curl -v.","language":"bash","checks":["Explain DNS resolution versus network reachability.","Map a retransmission symptom to TCP counters.","Describe the effects of an incorrect firewall zone or conntrack saturation."],"quiz":[["What proves that the TCP three-way handshake completed?","An established socket or a capture showing SYN, SYN-ACK and ACK; DNS lookup alone does not."]]},"kernel-eevdf-scheduler-deep-dive":{"explain":["Linux began adopting Earliest Eligible Virtual Deadline First (EEVDF) starting with kernel 6.6, evolving from CFS. It still tracks fair-service entitlement. A task with positive lag has received less CPU than entitlement and may be eligible. Eligible tasks compete via virtual deadlines, allowing latency-focused slices to receive responsive service.","This is not the textbook EDF real-time guarantee. EEVDF operates for fair scheduling; Linux also has RT classes, deadline scheduling, cgroup bandwidth limits, CPU capacity considerations, migration, interrupts and throttling. Task eligibility and selection depend on kernel version and state.","Inspect /proc/PID/sched for runtime indicators, but do not infer the live algorithm from one counter. Pair kernel docs for your exact release with tracepoints and workload response curves. A process with short virtual deadlines may respond quickly while a cgroup CPU limit still throttles it."],"trace":["Enqueue fair task","Update service / lag","Eligibility check: lag ≥ 0","Select earliest virtual deadline","Run and update virtual runtime"],"sample":"uname -r\ncat /proc/self/sched | head -35\ncat /sys/fs/cgroup/cpu.stat 2>/dev/null\n# Use trace-cmd/perf on a dedicated lab only; tracing can add overhead.","language":"bash","checks":["Explain lag, eligibility and virtual deadline separately.","Contrast EEVDF fair scheduling with SCHED_DEADLINE.","State which parts of your evidence are kernel-version-specific."],"quiz":[["Is EEVDF a real-time deadline guarantee?","No. It is part of fair scheduling; deadline-policy semantics are different."]]},"rhcsa-selinux-contexts-and-modes":{"explain":["Linux discretionary access control (DAC) checks Unix owner, group, mode and ACLs. SELinux adds mandatory policy checks that can deny access despite permissive DAC. Process/domain and object/file type labels determine permitted actions; contexts often have user:role:type:level components.","During troubleshooting inspect AVC denials and context labels. For files placed in custom paths, persistent mapping (`semanage fcontext -a`) plus `restorecon` is safer than repeated manual `chcon` (which can be reset by relabeling). Modes are enforcing, permissive and disabled; permissive records what would have been denied, but do not use it as the permanent fix.","If httpd cannot read a new directory, check DAC/traverse rights, then source and target SELinux types, booleans and port labels where relevant. Fix a type mismatch using a policy-appropriate label and verify it remains after relabeling/reboot."],"trace":["Process with domain type","File with target type","DAC/ACL check","SELinux policy decision","Audit AVC + allow/deny"],"sample":"getenforce\nls -Z /var/www/html\nps -eZ | grep httpd || true\nsudo ausearch -m AVC -ts recent | tail -15\n# Lab example only, with policy tools installed:\nsudo semanage fcontext -a -t httpd_sys_content_t \"/srv/labweb(/.*)?\"\nsudo restorecon -RFv /srv/labweb","language":"bash","checks":["Demonstrate context persistence after restorecon.","Differentiate file context, SELinux boolean and port type issues.","Explain why chmod 777 is not a viable SELinux solution."],"quiz":[["Why should chcon alone not be your persistent fix?","A future relabel/restorecon can replace it; persistent mappings need semanage fcontext."]]},"rhcsa-lvm-pv-vg-and-lv":{"explain":["Linux LVM adds indirection: a block partition/disk becomes a physical volume (PV); a volume group (VG) pools physical extents; logical volumes (LV) take extents from the VG. Filesystems live on LVs and mounts expose them to userspace.","Growing a filesystem needs free VG space, LV extension and filesystem growth. For XFS online growth use xfs_growfs on a mounted filesystem; ext4 can typically grow with resize2fs. Shrinking XFS is not generally supported. Destructive commands such as pvcreate/mkfs operate on devices and must never be copied blindly.","Persistent identity matters. In /etc/fstab prefer correct UUID/mapper identifier, test with findmnt --verify and mount -a in a lab, then reboot the disposable VM to prove mounts. Snapshotting does not replace an independent backup."],"trace":["Block device/partition","PV metadata + extents","VG free space pool","LV allocation","Filesystem + mount"],"sample":"lsblk -f\npvs; vgs; lvs -a -o+devices\nfindmnt --verify\n# Destructive lab planning (do not execute on an existing disk):\n# pvcreate /dev/LAB_DISK ; vgcreate vg_lab /dev/LAB_DISK\n# lvcreate -L 1G -n lv_data vg_lab ; mkfs.xfs /dev/vg_lab/lv_data","language":"bash","checks":["Diagram PV/VG/LV/filesystem/mount boundaries.","Calculate remaining VG extents after one LV allocation.","Explain XFS extension versus shrink limitations."],"quiz":[["What should you grow first, the LV or the filesystem?","Grow the underlying LV, then use the filesystem-specific growth tool."]]},"rhce-playbook-syntax-and-yaml":{"explain":["A playbook is a YAML list of plays. Each play selects hosts, can set become, and contains ordered tasks. Modules implement desired state; handlers respond only when notified by changed tasks and commonly restart services. A module can return changed/failed; these outcomes differ from the shell process exit code in subtle ways.","Indentation is semantic: tasks is a list, each task entry is a mapping, and module parameters form a mapping. Quote Jinja expressions when the scalar begins with `{{ ... }}`. Prefer fully qualified collection names for repeatability.","A reliable change sequence checks syntax and inventory, runs `--check --diff` where supported, converges once, repeats to test idempotence, then checks service state and host reachability. Check mode is not a perfect simulation of every task."],"trace":["Inventory: web hosts","Play: hosts + become","Tasks: package and file","notify → handler restart","Verify + rerun changed=0"],"sample":"---\n- name: Configure web lab hosts\n  hosts: web\n  become: true\n  tasks:\n    - name: Install Apache\n      ansible.builtin.package:\n        name: httpd\n        state: present\n      notify: Restart Apache\n    - name: Ensure service enabled and running\n      ansible.builtin.service:\n        name: httpd\n        enabled: true\n        state: started\n  handlers:\n    - name: Restart Apache\n      ansible.builtin.service:\n        name: httpd\n        state: restarted","language":"yaml","checks":["Annotate every YAML indentation level.","Syntax check and run with lab inventory.","Run twice and explain changed=0; check whether a restart was required."],"quiz":[["When does a handler normally run?","After a notifying task reports changed, subject to handler timing and the play lifecycle."]]},"rhce-handlers-and-notifications":{"explain":["Handlers prevent needless restarts by waiting for task changes. Multiple tasks can notify the same handler; notifications are coalesced for a play flush boundary. Handlers generally run after the normal tasks in a section unless explicitly flushed.","Use handlers for services whose running config changes only when configuration files or packages actually change. A failed task can prevent handler execution, so consider failure behavior and use force_handlers only with a clear understanding. Restarts are operational changes and may cause temporary outages.","In a rolling update, use serial and health checks in conjunction with handlers. A configuration template should notify restart, while a read-only validation should not falsely report changed."],"trace":["Template task checks checksum","Content changed?","Notify registered handler","Flush handler batch","Health check service"],"sample":"- name: Deploy web config\n  ansible.builtin.template:\n    src: httpd.conf.j2\n    dest: /etc/httpd/conf/httpd.conf\n    validate: \"httpd -t -f %s\"\n  notify: Restart Apache\n\n# handlers:\n# - name: Restart Apache\n#   ansible.builtin.service:\n#     name: httpd\n#     state: restarted","language":"yaml","checks":["Explain handler de-duplication.","Demonstrate a changed template triggers once.","Demonstrate unchanged template does not restart."],"quiz":[["Why are unconditional restart tasks often undesirable?","They cause avoidable disruption and defeat idempotent state changes."]]},"python-functions-and-scope":{"explain":["Functions package behavior and introduce a local scope. Python resolves names through local, enclosing, global and builtins (LEGB). A function argument is a new name bound to an object; mutating a shared mutable argument differs from rebinding a local variable.","Default argument values are evaluated when the function is defined, not on each call. A mutable list used as a default will persist across calls. Prefer `None` sentinel and allocate a fresh list inside. Lexical closures capture variables by reference to their containing scope; late binding in loop closures is a common source of bugs.","Type hints document expected contracts but do not enforce values at runtime. Test contract boundaries including empty inputs, wrong types and exceptions. Keep side effects visible to simplify troubleshooting."],"trace":["Define function + defaults","Call: bind arguments","Resolve local/enclosing/global","Return value or raise","Test state and side effects"],"sample":"def add_item(value, items=None):\n    if items is None:\n        items = []\n    items.append(value)\n    return items\n\nprint(add_item(1))  # [1]\nprint(add_item(2))  # [2], not [1,2]\n\n# Lexical closures:\ndef multiplier(factor):\n    return lambda number: factor * number\nprint(multiplier(3)(4)) # 12","language":"python","checks":["Explain LEGB with a nested function.","Reproduce and correct a mutable default pitfall.","Write edge-case assertions and inspect types."],"quiz":[["When are default argument objects created?","Once at function definition time."]]},"python-asyncio-and-async-await":{"explain":["An async function returns a coroutine object. It does not execute simply because it was called. `await` suspends a coroutine until the awaited operation completes, permitting another runnable task on the same event loop to progress. This is cooperative concurrency, not automatic CPU parallelism.","Asyncio is useful when tasks spend time waiting on I/O. Using time.sleep() or expensive pure Python loops inside the event loop stalls all coroutines. Prefer asyncio.sleep for timed waits and asyncio.to_thread or processes for suitable blocking work. Cancellation is part of the correctness contract: clean up resources in finally blocks.","Use TaskGroup for structured concurrency where supported, and explicit timeouts to prevent stuck requests. Semaphore concurrency limits stop unbounded resource consumption. In systems software, also plan retries, backoff, idempotence and graceful shutdown."],"trace":["Create coroutine objects","Schedule tasks on event loop","Task awaits I/O","Other ready tasks advance","Result/cancellation + cleanup"],"sample":"import asyncio\n\nasync def fetch(item):\n    await asyncio.sleep(0.1)  # simulate I/O, not real HTTP\n    return item * 2\n\nasync def main():\n    async with asyncio.TaskGroup() as group:\n        tasks = [group.create_task(fetch(n)) for n in range(3)]\n    print([task.result() for task in tasks])  # [0, 2, 4]\n\nasyncio.run(main())","language":"python","checks":["Compare sequential 3×0.1 s versus scheduled I/O waits.","Show why time.sleep blocks the loop.","Explain how a failed child affects TaskGroup siblings."],"quiz":[["Does async/await automatically use multiple CPU cores?","No. The event loop is typically cooperative on one thread; concurrency arises through awaitable waits."]]},"elk-elastic-stack-architecture":{"explain":["Data originates as a log or metric and passes through an agent/shipper, optional Logstash or ingest pipeline, Elasticsearch primary shards and Kibana search. Elastic documents live in an inverted-index-based search system, not a transactional PostgreSQL-like relational store.","Bulk indexing occurs per shard and is subject to refresh semantics. A document may be durably acknowledged before it is visible to search; search visibility is near-real-time and refreshed periodically. Replicas improve availability/search capacity but do not preserve historical recovery against deletion, bad writes or lost credentials.","Build a data contract early: timestamp, host, process, event category, timezone, stable IDs and ECS conventions. Backpressure and pipeline acknowledgements determine whether a source may replay events."],"trace":["Filebeat/Agent","Optional Logstash or ingest processor","Elasticsearch primary shard","Refresh + optional replica","Kibana query/alert"],"sample":"# In Kibana Dev Tools on a disposable authenticated cluster:\nPUT lab-events/_doc/1\n{ \"@timestamp\":\"2026-10-27T00:00:00Z\", \"message\":\"lab online\", \"event\":{\"category\":\"process\"} }\n\nPOST lab-events/_refresh\nGET lab-events/_search\n{ \"query\": { \"match\": { \"message\": \"online\" } } }","language":"http","checks":["Trace source offset, ingest ACK, write and search visibility.","Map one JSON event to ECS fields.","Explain why a replica is not a backup."],"quiz":[["Is a document always immediately searchable after successful indexing?","Not necessarily; refresh controls near-real-time search visibility."]]},"elk-snapshot-repository-setup":{"explain":["Elasticsearch snapshots are the supported cluster data recovery mechanism. Snapshots preserve indices and selected feature states/cluster metadata depending on options. They do not include external node config files, registered repository configuration or all secret material. Configuration, certificates and infrastructure definitions need separate protected backups.","A filesystem repository for a self-managed cluster requires an allowed path.repo location on every required master/data node, accessible shared storage and correct permissions. For multi-node deployments, independent local paths with the same name are NOT a shared repository. Verify repository operations from the cluster and consider repository analysis.","A snapshot is not proven until a clean restore test on a compatible isolated recovery cluster. Plan how to restore security feature states cautiously; restoring indices with rename patterns is useful for lab validation without overwriting live names."],"trace":["Configure shared repository access","Register repository","Verify repository on nodes","Create snapshot + inspect status","Restore to isolated compatible cluster"],"sample":"# On every required node: elasticsearch.yml\n# path.repo: [\"/mnt/es_snapshots\"]\n\n# In Kibana Dev Tools on an AUTHENTICATED LAB cluster:\nPUT _snapshot/lab_repo\n{ \"type\":\"fs\", \"settings\": {\"location\":\"/mnt/es_snapshots\"} }\n\nPOST _snapshot/lab_repo/_verify\nGET _snapshot/lab_repo","language":"http","checks":["Confirm repo is truly shared across eligible nodes.","Verify snapshot contains desired data streams and feature states.","Document separate node-config/certificates backup and restore location."],"quiz":[["Why can an Elasticsearch snapshot omit important deployment configuration?","Node settings and external keys/files are not all captured; back them up separately."]]},"elk-manual-snapshots-and-restore":{"explain":["Create a named snapshot, poll task status, inspect `state: SUCCESS` and ensure every intended index/data stream was included. A snapshot repository is external to the cluster; point-in-time contents are consistent per shard, not necessarily a single global transaction cut across all shards.","For restore, record existing index names, cluster/index compatibility, feature states, templates and conflict resolution. Rehearse with renamed indices on a disposable cluster, then compare document counts and selected known hashes/IDs. Do not restore blindly over currently open indices.","Automate Snapshot Lifecycle Management (SLM) retention but retain independent audit evidence: latest success timestamp, restore test date, repo capacity and failed snapshot alerts. Replication is not a substitute for backup."],"trace":["List indices/data streams","Snapshot + wait/poll","Inspect status","Isolated restore with rename","Validate and record RPO/RTO"],"sample":"PUT _snapshot/lab_repo/snap_001?wait_for_completion=true\n{ \"indices\":\"lab-*\", \"include_global_state\":false }\n\nGET _snapshot/lab_repo/snap_001\n\n# Isolated lab: rename restore to avoid collisions\nPOST _snapshot/lab_repo/snap_001/_restore\n{ \"indices\":\"lab-*\", \"include_global_state\":false,\n  \"rename_pattern\":\"(.+)\",\"rename_replacement\":\"restored-$1\" }\n\nGET _cat/indices/restored-*?v","language":"http","checks":["Inspect snapshot state and errors.","Restore to renamed indices, not production.","Validate sample known document IDs, index health and documented retention."],"quiz":[["Why is a green cluster not a verified backup?","Availability does not show recoverability from deletion or a disaster."]]},"postgres-postgresql-process-and-memory-architecture":{"explain":["PostgreSQL is a multi-process server. A postmaster supervises and accepts connections, with backend processes serving sessions in a conventional architecture. Shared memory holds shared_buffers and other metadata; local per-query memory includes work_mem; background tasks handle WAL writing, checkpoints, vacuum, and other maintenance.","A SELECT is parsed, rewritten, optimized into a plan, executed through access methods and buffer reads. A transaction that writes changes data buffers and WAL records. Durability depends on WAL flushing rules, not necessarily immediate writes of every heap page. Locks and MVCC visibility constrain what concurrent sessions can observe.","Memory planning cannot multiply a single work_mem setting by number of connections alone; one query can use several sort/hash nodes and parallel workers. Read execution plans and workload concurrency together."],"trace":["Client + backend","Parse/rewrite/plan","Executor + shared buffers","Heap/index page access","WAL + commit/response"],"sample":"SELECT version();\nSHOW shared_buffers;\nSHOW work_mem;\nSHOW max_connections;\nSELECT pid,usename,state,wait_event_type,wait_event\nFROM pg_stat_activity ORDER BY pid LIMIT 12;","language":"sql","checks":["Distinguish shared_buffers from work_mem.","Identify a session backend and its waiting reason.","Explain how a commit can be durable before a heap flush."],"quiz":[["Why must work_mem be assessed with concurrency?","Each eligible execution operation and worker may consume work_mem independently."]]},"postgres-mvcc-and-transaction-visibility":{"explain":["PostgreSQL uses tuple versions and snapshots to present isolation between concurrent transactions. Each row version carries inserting/deleting transaction metadata such as xmin/xmax. Visibility depends on whether inserting/deleting transactions were committed and on the observer’s snapshot.","An UPDATE may create a new tuple version and mark the old one no longer current; the old tuple may remain for readers whose snapshot needs it. VACUUM reclaims space after versions become globally unnecessary and handles freeze maintenance. Long-running transactions can retain old tuples and increase bloat.","Under READ COMMITTED each SQL statement usually sees a new snapshot; REPEATABLE READ uses a stable transaction snapshot with PostgreSQL-specific guarantees. SERIALIZABLE uses additional conflict tracking and may abort a transaction that applications must retry."],"trace":["Session A BEGIN","A reads snapshot S1","Session B UPDATE + COMMIT","A visibility depends on isolation","VACUUM later reclaims dead versions"],"sample":"-- Use two psql sessions on a SCRATCH database.\nCREATE TABLE mvcc_lab(id int PRIMARY KEY, value text);\nINSERT INTO mvcc_lab VALUES(1,'old');\n-- Session A:\nBEGIN ISOLATION LEVEL REPEATABLE READ;\nSELECT * FROM mvcc_lab;\n-- Session B: UPDATE mvcc_lab SET value='new' WHERE id=1; COMMIT;\n-- Session A: SELECT * FROM mvcc_lab; -- still old in same snapshot\n-- Session A: COMMIT; SELECT * FROM mvcc_lab; -- new","language":"sql","checks":["Demonstrate two-session visibility with timestamps.","Explain why long transactions cause vacuum trouble.","Distinguish isolation level behavior and serialization retry."],"quiz":[["Why does MVCC require vacuuming?","Dead tuple versions persist after updates/deletes until safe to reclaim."]]},"postgres-write-ahead-logging-and-checkpoints":{"explain":["Write-ahead logging enforces write-ahead order: WAL describing durable changes must reach stable storage before corresponding data pages are persisted in a way that could survive a crash. Commit acknowledgment behavior depends on synchronous_commit and replication settings.","Shared buffers may contain dirty heap/index pages. Checkpointer and background writer smooth writes; checkpoints establish recovery boundaries. During crash recovery, WAL replay restores changes that reached durable WAL even if heap pages had not been persisted.","A slow disk, large transactions and tight checkpoints can cause WAL pressure; archiving or replication slots may retain excessive WAL and fill the filesystem. Monitor `pg_stat_wal`, checkpoint stats, archive failures, replica lag and disk occupancy."],"trace":["Transaction modifies buffer","Generate WAL records","WAL flush before durable data","Commit acknowledged by configured rules","Checkpoint + crash replay"],"sample":"SHOW wal_level;\nSHOW synchronous_commit;\nSHOW archive_mode;\nSELECT pg_current_wal_lsn();\nSELECT * FROM pg_stat_wal;\nSELECT * FROM pg_stat_archiver;","language":"sql","checks":["State write-ahead invariant correctly.","Show a WAL LSN and archiving status.","Explain why archive failure can fill pg_wal despite healthy queries."],"quiz":[["Does commit require an immediate disk flush of all heap pages?","No; WAL durability and data page writeback are separated."]]},"postgres-physical-backup-pg-basebackup":{"explain":["A physical base backup is a consistent copy of a cluster’s files, paired with WAL necessary for recovery. `pg_basebackup` can include required WAL with `-X stream`. It depends on matching major-version compatibility and proper replication privileges/settings; it backs up the entire cluster, not a selected table.","A backup manifest permits integrity verification by pg_verifybackup. Retain checksums/manifests and all required WAL to ensure recoverability. In newer PostgreSQL major versions, incremental physical backup features exist, but full/incremental dependencies and WAL summary prerequisites must be tracked explicitly.","Restore only into a separate stopped and empty data directory on a disposable instance with compatible binaries. Validate postgres startup, sample queries and role/application access. Never copy a live cluster data directory without a supported coordinated backup method."],"trace":["Check replication/backup permissions","pg_basebackup + WAL","Verify manifest","Prepare empty isolated PGDATA","Start clone + validate rows"],"sample":"# On a disposable test server, configure a replication-capable role first.\npg_basebackup -h 127.0.0.1 -U replicator \\\n  -D /safe/lab-backup -Fp -Xs -P\npg_verifybackup /safe/lab-backup\n# Stop here: follow version-specific restore-to-NEW-PGDATA runbook.","language":"bash","checks":["Explain physical versus logical backup use cases.","Record manifest verification result.","Run a clean isolated clone restore with version checks."],"quiz":[["Can a physical backup be used as a direct per-table dump?","No. It restores cluster-level files; use logical tools for selected databases/objects."]]},"postgres-continuous-archiving-and-pitr":{"explain":["PITR combines a known-good base backup with a continuous, complete stream of archived WAL segments. The replay process starts from the base backup checkpoint, reads WAL in order and stops at a chosen recovery target such as timestamp, LSN or restore point.","Typical self-managed configuration enables archive_mode and a durable archive_command, then confirms `pg_stat_archiver` success. Ensure complete WAL coverage from the base backup through target. Restoring a base backup without required WAL cannot produce a consistent target. Avoid unsafe overwrites of the original tablespace paths.","Recovery on modern PostgreSQL uses recovery.signal and restore_command in a separate instance. It must use compatible version binaries and isolated volumes/ports. Promotion after target recovery ends replay and creates a new timeline; document that operational consequence."],"trace":["Enable/verify WAL archive","Take + verify base backup","Choose UTC recovery target","Restore into isolated PGDATA + recovery.signal","Replay WAL, validate, promote if required"],"sample":"# postgresql.conf - EXAMPLE ONLY, protect archive directory\nwal_level = replica\narchive_mode = on\narchive_command = 'test ! -f /safe/wal/%f && cp %p /safe/wal/%f'\n\n# Separate stopped lab data directory only:\nrestore_command = 'cp /safe/wal/%f %p'\nrecovery_target_time = '2026-10-01 12:00:00+00'\n# touch /isolated/PGDATA/recovery.signal\n# Connect to ISOLATED clone and check pg_is_in_recovery() status.","language":"configuration","checks":["Show base backup manifest and WAL coverage.","Reproduce deletion then restore to before deletion in isolated cluster.","State RPO/RTO from measured restore and archive timestamps."],"quiz":[["What two ingredients make PITR possible?","A consistent base backup plus uninterrupted required WAL archive through the selected recovery target."]]},"postgres-explain-analyze-and-query-plans":{"explain":["PostgreSQL optimizer chooses access paths by cost estimates derived from statistics, row counts, distribution and planner settings. A sequential scan is not intrinsically wrong; small tables or unselective predicates can favor it.","EXPLAIN displays estimated cost/rows; EXPLAIN ANALYZE actually executes the statement and reports actual rows/timing. Buffers illuminate cache and physical reads; temp files can signal spills; nested loop, hash join and merge join have different strengths depending on join cardinality and sort/index paths.","Use a copied or read-only workload for EXPLAIN ANALYZE on writes because the statement executes (even if wrapped in a rollback). Troubleshoot cardinality error before randomly raising work_mem or adding indexes. Capture normalized SQL, plans, timings, and stable datasets."],"trace":["Parse/query rewrite","Statistics + row estimates","Choose scan and join strategy","Execute physical nodes","Compare estimated/actual rows & buffers"],"sample":"CREATE TABLE IF NOT EXISTS plan_lab AS\nSELECT i AS id, (i % 100) AS bucket FROM generate_series(1,10000) i;\nANALYZE plan_lab;\nEXPLAIN (ANALYZE, BUFFERS, FORMAT TEXT)\nSELECT * FROM plan_lab WHERE bucket = 7;\n-- Compare after adding an index in an isolated lab only.","language":"sql","checks":["Compare estimated vs actual rows.","Explain why seq scan can beat index scan.","Measure changed plan and timing after a justified test index."],"quiz":[["Does EXPLAIN ANALYZE execute the SQL?","Yes. Unlike plain EXPLAIN, it actually runs the statement."]]}},"focus":{"os-fcfs-sjf-and-srtf-scheduling":"At t=0 P1(8) runs under FCFS; at t=1 P2(4) arrives. SRTF preempts P1 because remaining 7 exceeds P2 4. Non-preemptive SJF waits until P1 finishes before switching. Always show idle gaps and ties.","os-fair-scheduling-and-eevdf":"Virtual runtime and lag express fair service; eligibility and virtual deadline are Linux fair-scheduler concepts, not an absolute real-time deadline. Verify release-specific behavior via kernel documentation.","os-fifo-lru-and-page-replacement":"FIFO evicts oldest loaded page regardless of reference recency; LRU updates recency on every access. Belady anomaly can occur for FIFO. Real Linux reclaim approximates working sets, not textbook exact LRU.","os-demand-paging-and-page-faults":"Read page fault handler outcomes: file page not resident (major I/O), zero-fill or CoW (typically minor), and invalid access (SIGSEGV). TLB miss alone is not a page fault.","linux-oom-killer-and-memory-pressure":"Inspect dmesg, memory.events, PSI, anon/cache balance, swap and victim oom_score_adj. A memcg OOM is possible even when host MemAvailable looks healthy.","linux-ext4-xfs-and-journaling":"XFS supports online growth but generally not shrink. EXT4 and XFS journal metadata differently; fsync and ordered writes matter for crash consistency. Never test repair on the mounted production source.","kernel-buddy-allocator-and-slub":"Buddy allocator splits/coalesces page blocks by power-of-two order; SLUB caches fixed-size kernel objects. High-order allocation can fail due to fragmentation despite free memory.","kernel-reclaim-swap-and-writeback":"Reclaim considers file cache and anonymous memory; dirty pages must be written before eviction; direct reclaim stalls application threads, which surfaces in PSI and latency.","rhcsa-firewalld-services-and-zones":"A rich rule in the wrong zone has no effect. Distinguish current runtime from --permanent config; reloading the firewall can alter established connectivity, particularly on remote hosts.","rhcsa-rhcsa-timed-practice-exam":"Practice on a disposable RHEL VM with two extra virtual disks and a console. Tasks should include users, LVM+fstab, SELinux file/port context, firewalld, service, schedule and verification after reboot.","rhce-variables-precedence-and-secrets":"Extra vars have very high precedence; use group_vars/host_vars for scoped config and Ansible Vault for encrypted-at-rest secrets. no_log avoids task log leaks but not poor secret hygiene elsewhere.","rhce-error-handling-and-blocks":"Block/rescue/always applies task error handling; unreachable hosts behave differently from failed tasks. A rescue is not automatic transactional rollback of filesystem changes.","python-concurrency-with-threads":"CPython’s conventional GIL impacts CPU-bound Python threads; the exact runtime build may differ, and I/O can overlap while threads release or yield the GIL. Protect mutable shared state.","python-multiprocessing-and-ipc":"Processes provide CPU parallelism at the cost of startup, pickling/IPC and memory overhead. Always protect process-start logic under __main__ where relevant.","elk-ilm-lifecycle-and-retention":"ILM defines rollover/retention phases while SLM manages backups; deleting primary indices through ILM is not an archive. Validate aliases, data-stream templates and phase conditions.","elk-snapshot-lifecycle-management":"Monitor SLM run status and retention failures independently. A configured policy without successful snapshots and test restores does not meet RPO/RTO goals.","postgres-vacuum-analyze-and-bloat":"VACUUM removes dead tuples when no running snapshot needs them; ANALYZE refreshes planning stats. Freeze protects against transaction ID wraparound. Avoid disabling autovacuum as a shortcut.","postgres-streaming-replication":"WAL sender transfers records to a standby for replay. Async replica may lag/loss on failover; physical replication is not a historical backup. Monitor write/flush/replay LSN lag.","postgres-connection-pooling-and-ha":"PgBouncer transaction pooling reduces backend overhead but breaks features requiring persistent session state; failover requires routing, fencing/leader choice and consistency planning.","ops-backup-strategy-rpo-and-rto":"RPO is tolerated data loss; RTO is target downtime. Measured restore time must include secrets, DNS, app startup, integrity checks, service verification and communication—not only extraction."},"official":[{"name":"Red Hat RHCSA EX200 official objectives","url":"https://www.redhat.com/en/services/training/ex200-red-hat-certified-system-administrator-rhcsa-exam","note":"Exam version at publication: RHEL 10; verify your enrolled offering."},{"name":"Red Hat Ansible EX294 exam objectives","url":"https://www.redhat.com/en/services/training/ex294-red-hat-certified-engineer-rhce-exam-red-hat-enterprise-linux","note":"EX294 objectives/branding vary by current credential path; verify purchased version."},{"name":"Linux kernel EEVDF documentation","url":"https://docs.kernel.org/scheduler/sched-eevdf.html","note":"Eligible lag and virtual deadlines; verify source against your kernel release."},{"name":"Elasticsearch snapshot and restore","url":"https://www.elastic.co/docs/deploy-manage/tools/snapshot-and-restore","note":"Supported repository snapshots, feature states, excluded configs."},{"name":"Elasticsearch self-managed repositories","url":"https://www.elastic.co/docs/deploy-manage/tools/snapshot-and-restore/self-managed","note":"Shared repository configuration, verification and consistency requirements."},{"name":"PostgreSQL continuous archiving and PITR","url":"https://www.postgresql.org/docs/current/continuous-archiving.html","note":"Physical backups, WAL archive continuity, recovery targets, version caveats."},{"name":"Python asyncio reference","url":"https://docs.python.org/3/library/asyncio.html","note":"Async tasks and structured concurrency, event loop and cancellation."}]};
const ids=new Set(D.lessons.map(x=>x.id));
for(const l of E.newLessons){if(!ids.has(l.id)){D.lessons.push(l);ids.add(l.id);}}
for(const [id,m] of Object.entries(E.master)){const l=D.lessons.find(x=>x.id===id);if(!l) throw Error('Missing masterclass lesson: '+id);l.master=m;l.deep=true;l.depth='masterclass';l.level='Masterclass';}
for(const [id,focus] of Object.entries(E.focus)){const l=D.lessons.find(x=>x.id===id);if(l){l.focus=focus;}}
for(const l of D.lessons){if(l.deep&&!l.master){l.depth='extended';} }
for(const track of D.tracks){let i=0;D.lessons.filter(x=>x.track===track.id).forEach(l=>{l.index=++i;});}
for(const r of E.official){if(!D.references.some(x=>x.url===r.url))D.references.push(r);}
D.edition='2.0';D.expansionSummary={additional: E.newLessons.length, masterclasses:Object.keys(E.master).length};
})();
